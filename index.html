  G.tapZones.push({x: px, y: by, w: pw, h: bh, fn: () => openGarage('modes')});
  drawParts();
}

function drawGarage(){
  const pw = Math.min(W * 0.92, 400), ph = 500;
  const px = W / 2 - pw / 2, py = H / 2 - ph / 2;
  ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#141a2e';
  rr(px, py, pw, ph, 22); ctx.fill();
  ctx.strokeStyle = 'rgba(255,209,102,.55)'; ctx.lineWidth = 2;
  rr(px, py, pw, ph, 22); ctx.stroke();
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff'; ctx.font = '900 26px -apple-system,Segoe UI,Roboto,sans-serif';
  ctx.fillText('🏪 GARAGE', W / 2, py + 42);
  ctx.font = '700 15px sans-serif'; ctx.fillStyle = '#ffd166';
  ctx.fillText('🪙 BANK  ' + G.bank, W / 2, py + 66);
  G.tapZones = [];
  // tabs
  const doneCount = MISSIONS.filter(m => (G.mprog[m.id] || {}).done).length;
  const tabs = [
    {id:'paints', label:'🎨 PAINTS'},
    {id:'missions', label:'🎯 ' + doneCount + '/' + MISSIONS.length},
  ];
  const tw = (pw - 32 - 10) / 2;
  tabs.forEach((t, i) => {
    const tx = px + 16 + i * (tw + 10), ty = py + 80, th = 36;
    const sel = G.garTab === t.id;
    ctx.fillStyle = sel ? 'rgba(255,209,102,.22)' : 'rgba(255,255,255,.06)';
    rr(tx, ty, tw, th, 10); ctx.fill();
    ctx.strokeStyle = sel ? '#ffd166' : 'rgba(255,255,255,.15)'; ctx.lineWidth = sel ? 2 : 1;
    rr(tx, ty, tw, th, 10); ctx.stroke();
    ctx.fillStyle = sel ? '#ffd166' : 'rgba(255,255,255,.75)';
    ctx.font = '800 14px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(t.label, tx + tw / 2, ty + 23);
    G.tapZones.push({x: tx, y: ty, w: tw, h: th, fn: ((id) => () => { G.garTab = id; })(t.id)});
  });
  if(G.garTab === 'missions') drawGarageMissions(px, py, pw);
  else drawGaragePaints(px, py, pw);
  // back
  const bw = pw - 32, bx = px + 16, by = py + ph - 66, bh = 50;
  ctx.fillStyle = 'rgba(255,255,255,.12)';
  rr(bx, by, bw, bh, 14); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = '800 17px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('‹ BACK', W / 2, by + 32);
  G.tapZones.push({x: bx, y: by, w: bw, h: bh, fn: () => {
    if(G.garageFrom === 'modes'){ G.state = ST.MENU; G.menuView = 'modes'; }
    else { G.state = ST.OVER; }
  }});
  drawParts();
}

function drawGaragePaints(px, py, pw){
  const rh = 64, gap = 8;
  let ry = py + 128;
  for(let i = 0; i < PAINTS.length; i++){
    const P = PAINTS[i];
    const selected = G.paint === i, owned = G.owned[i];
    ctx.fillStyle = selected ? 'rgba(255,209,102,.14)' : 'rgba(255,255,255,.04)';
    rr(px + 16, ry, pw - 32, rh, 14); ctx.fill();
    ctx.strokeStyle = selected ? '#ffd166' : 'rgba(255,255,255,.14)'; ctx.lineWidth = selected ? 2.5 : 1.5;
    rr(px + 16, ry, pw - 32, rh, 14); ctx.stroke();
    // mini rickshaw swatch
    drawRickshaw(px + 62, ry + 52, 0.30, {paint: i});
    ctx.textAlign = 'left';
    ctx.fillStyle = '#fff'; ctx.font = '800 15px sans-serif';
    ctx.fillText(P.name, px + 104, ry + 28);
    ctx.textAlign = 'right';
    if(owned){
      ctx.fillStyle = selected ? '#7CFC98' : '#0ea5e9';
      ctx.font = '800 14px sans-serif';
      ctx.fillText(selected ? '✓ SELECTED' : 'SELECT', px + pw - 30, ry + 38);
    } else {
      const afford = G.bank >= P.cost;
      ctx.fillStyle = afford ? '#ffd166' : 'rgba(255,255,255,.4)';
      ctx.font = '800 14px sans-serif';
      ctx.fillText('🪙 ' + P.cost, px + pw - 30, ry + 38);
    }
    G.tapZones.push({x: px + 16, y: ry, w: pw - 32, h: rh, fn: ((idx) => () => garageTap(idx))(i)});
    ry += rh + gap;
  }
  if(G.garageMsgT > 0){
    ctx.textAlign = 'center'; ctx.fillStyle = '#ff9f1c'; ctx.font = '800 15px sans-serif';
    ctx.fillText(G.garageMsg, W / 2, ry + 4);
  }
}

function drawGarageMissions(px, py, pw){
  const rh = 27, gap = 3;
  let ry = py + 128;
  for(const m of MISSIONS){
    const st = G.mprog[m.id] || {p:0, done:false};
    ctx.fillStyle = st.done ? 'rgba(124,252,152,.07)' : 'rgba(255,255,255,.04)';
    rr(px + 16, ry, pw - 32, rh, 9); ctx.fill();
    const pct = clamp(st.p / m.target, 0, 1);
    ctx.fillStyle = 'rgba(255,255,255,.10)';
    rr(px + 28, ry + 17, pw - 56, 4, 2); ctx.fill();
    ctx.fillStyle = st.done ? '#7CFC98' : '#ffd166';
    if(pct > 0){ rr(px + 28, ry + 17, Math.max(4, (pw - 56) * pct), 4, 2); ctx.fill(); }
    ctx.textAlign = 'left';
    ctx.fillStyle = st.done ? '#7CFC98' : '#fff';
    ctx.font = '800 12px sans-serif';
    ctx.fillText((st.done ? '✅ ' : '🎯 ') + m.name, px + 28, ry + 12);
    ctx.textAlign = 'right';
    ctx.fillStyle = st.done ? '#7CFC98' : '#ffd166';
    ctx.font = '700 10.5px sans-serif';
    ctx.fillText(st.done ? 'DONE +' + m.reward + ' 🪙' : st.p + '/' + m.target + ' · +' + m.reward + ' 🪙', px + pw - 28, ry + 12);
    ry += rh + gap;
  }
}

function vignette(){
  const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.42, W / 2, H / 2, Math.max(W, H) * 0.75);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,.38)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

/* ---------- main loop ---------- */
window.RR_ADS = window.RR_ADS || {
  showRewarded(cb){ try{ cb(true); }catch(e){} },
  removeAdsOwned(){ return false; }
};
let lastT = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  G.time += dt;
  // screen shake decay
  if(G.shake > 0){
    G.shake = Math.max(0, G.shake - dt * 1.6);
    G.shakeX = rand(-1, 1) * 14 * G.shake;
    G.shakeY = rand(-1, 1) * 10 * G.shake;
  } else { G.shakeX = 0; G.shakeY = 0; }

  ctx.save();
  ctx.translate(G.shakeX, G.shakeY);
  if(G.state === ST.OPENING){ updateOpening(dt); updateParts(dt); drawOpening(); }
  else if(G.state === ST.COUNTDOWN){
    updateParts(dt);
    const prev = Math.ceil(3 - G.cdT);
    G.cdT += dt;
    const cur = Math.ceil(3 - G.cdT);
    if(cur !== prev && cur >= 0){ AudioSys.count(cur === 0); if(cur === 0) confettiBurst(40); }
    if(G.cdT >= 3.6){ G.state = ST.PLAY; G.paused = false; }
    drawCountdown();
  }
  else if(G.state === ST.PLAY){
    if(!G.paused){
      if(G.slowT > 0) G.slowT -= dt; // dramatic slow-mo after losing a heart
      updatePlay(dt * (G.slowT > 0 ? 0.35 : 1));
      updateParts(dt);
    }
    drawPlay();
  }
  else if(G.state === ST.OVER){ G.overT += dt; updateParts(dt); drawGameOver(); }
  else if(G.state === ST.MENU){ if(G.garageMsgT > 0) G.garageMsgT -= dt; drawSky(); drawBuildings(); drawStreetlights(); drawRoad(); updateParts(dt); if(G.menuView === 'garage') drawGarage(); else drawModes(); }
  ctx.restore();
  requestAnimationFrame(frame);
}
updateHUD();
requestAnimationFrame(frame);
</script>
