<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Rickshaw Rush — Grand Opening</title>
<meta name="description" content="Rickshaw Rush: dodge traffic, grab fares and coins in a neon Indian city. Free, offline, no ads.">
<meta name="theme-color" content="#0b1020">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23f59e0b'/%3E%3Ctext x='50' y='68' font-size='44' text-anchor='middle' fill='%23111' font-family='sans-serif' font-weight='bold'%3E%E0%A4%9F%3C/text%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#05070f}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;user-select:none;-webkit-user-select:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;pointer-events:none;z-index:10;color:#fff}
#heartVal{color:#ff5d5d;letter-spacing:2px;text-shadow:0 0 8px rgba(255,93,93,.7)}
#hudScore{top:calc(10px + env(safe-area-inset-top));left:14px}
#hudScore .lbl{font-size:10px;letter-spacing:2px;opacity:.7}
#hudScore .val{font-size:30px;font-weight:800;text-shadow:0 2px 8px rgba(0,0,0,.6);font-variant-numeric:tabular-nums}
#hudLevel{top:calc(54px + env(safe-area-inset-top));left:14px;background:rgba(0,0,0,.45);border:1px solid rgba(255,209,102,.5);color:#ffd166;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:800;letter-spacing:1px}
#hudCoins{top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:7px 16px;font-size:16px;font-weight:700}
#hudBtns{top:calc(10px + env(safe-area-inset-top));right:12px;display:flex;gap:10px;pointer-events:auto}
.hbtn{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.45);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.hbtn:active{transform:scale(.92)}
#honkBtn{position:fixed;right:18px;bottom:calc(26px + env(safe-area-inset-bottom));width:76px;height:76px;border-radius:50%;border:3px solid rgba(255,255,255,.35);background:radial-gradient(circle at 35% 30%,#ffd166,#f59e0b 70%);color:#3a2200;font-size:15px;font-weight:800;z-index:10;cursor:pointer;box-shadow:0 6px 20px rgba(245,158,11,.45);pointer-events:auto}
#honkBtn:active{transform:scale(.9)}
#steerHint{position:fixed;left:0;right:0;bottom:calc(110px + env(safe-area-inset-bottom));text-align:center;color:rgba(255,255,255,.85);font-size:14px;z-index:10;pointer-events:none;text-shadow:0 2px 6px #000;transition:opacity .6s}

</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud" id="hudScore"><div class="lbl">SCORE</div><div class="val" id="scoreVal">0</div></div>
<div class="hud" id="hudLevel">LV 1</div>
<div class="hud hidden" id="hudCoins">🪙 <span id="coinVal">0</span> &nbsp;·&nbsp; 🧍 <span id="fareVal">0</span> &nbsp;·&nbsp; <span id="heartVal">♥♥♥</span> <span id="tripVal"></span></div>
<div class="hud" id="hudBtns">
  <div class="hbtn" id="muteBtn">🔊</div>
  <div class="hbtn hidden" id="pauseBtn">⏸</div>
</div>
<button id="honkBtn" class="hidden">📯<br>HONK</button>
<div id="steerHint" class="hidden">◀ Drag or ← → to steer · Tap 📯 to honk ▶</div>

<script>
'use strict';
/* ================= RICKSHAW RUSH — Grand Opening Edition =================
   Endless arcade driver. Single file, zero dependencies, fully offline.
   Monetization hooks: window.RR_ADS = { showRewarded(cb), removeAdsOwned() }
========================================================================== */

const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize); resize();

/* ---------- utils ---------- */
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
function hash(n){ let x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

/* ---------- storage ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem('rr_' + k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('rr_' + k, JSON.stringify(v)); }catch(e){} }
};

/* ---------- audio (WebAudio synth, no assets) ---------- */
const AudioSys = {
  ctx: null, muted: store.get('muted', false), engineOsc: null, engineGain: null, engineFilter: null,
  init(){
    if(this.ctx) return;
    try{
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      // engine hum
      this.engineOsc = this.ctx.createOscillator();
      this.engineOsc.type = 'sawtooth'; this.engineOsc.frequency.value = 55;
      this.engineFilter = this.ctx.createBiquadFilter();
      this.engineFilter.type = 'lowpass'; this.engineFilter.frequency.value = 220;
      this.engineGain = this.ctx.createGain(); this.engineGain.gain.value = 0;
      this.engineOsc.connect(this.engineFilter).connect(this.engineGain).connect(this.ctx.destination);
      this.engineOsc.start();
    }catch(e){}
  },
  setEngine(on, speedT){
    if(!this.ctx || !this.engineGain) return;
    const t = this.ctx.currentTime;
    this.engineGain.gain.setTargetAtTime(this.muted || !on ? 0 : 0.05, t, 0.1);
    if(on) this.engineOsc.frequency.setTargetAtTime(55 + speedT * 70, t, 0.2);
  },
  blip(freq, dur, type, vol, slideTo){
    if(!this.ctx || this.muted) return;
    try{
      const t = this.ctx.currentTime;
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
      if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
      g.gain.setValueAtTime(vol || 0.18, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g).connect(this.ctx.destination);
      o.start(t); o.stop(t + dur + 0.02);
    }catch(e){}
  },
  noise(dur, vol, filterFreq){
    if(!this.ctx || this.muted) return;
    try{
      const t = this.ctx.currentTime, len = Math.floor(this.ctx.sampleRate * dur);
      const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = buf.getChannelData(0);
      for(let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const src = this.ctx.createBufferSource(); src.buffer = buf;
      const f = this.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = filterFreq || 800;
      const g = this.ctx.createGain(); g.gain.value = vol || 0.3;
      src.connect(f).connect(g).connect(this.ctx.destination); src.start(t);
    }catch(e){}
  },
  honk(){ this.blip(370, 0.28, 'square', 0.12); this.blip(466, 0.28, 'square', 0.12); },
  coin(){ this.blip(880, 0.09, 'sine', 0.16); setTimeout(() => this.blip(1318, 0.14, 'sine', 0.16), 70); },
  fare(){ [523, 659, 784].forEach((f, i) => setTimeout(() => this.blip(f, 0.12, 'triangle', 0.16), i * 80)); },
  crash(){ this.noise(0.5, 0.5, 500); this.blip(90, 0.4, 'sawtooth', 0.25, 40); },
  count(final){ this.blip(final ? 880 : 440, final ? 0.35 : 0.15, 'square', 0.14); },
  pop(){ this.noise(0.18, 0.2, 1200); },
  toggleMute(){
    this.muted = !this.muted; store.set('muted', this.muted);
    document.getElementById('muteBtn').textContent = this.muted ? '🔇' : '🔊';
    return this.muted;
  }
};
if(AudioSys.muted) document.getElementById('muteBtn').textContent = '🔇';
/* ---------- game state ---------- */
const ST = { OPENING: 0, MENU: 1, COUNTDOWN: 2, PLAY: 3, OVER: 4 };
const G = {
  state: ST.OPENING,
  ot: 0,                 // opening timeline
  time: 0,               // global anim time
  dayT: 0.18,            // time of day 0..1
  speed: 0, speedT: 0,    // speedT 0..1 normalized
  dist: 0, score: 0, coins: 0, fares: 0,
  best: store.get('best', 0),
  paint: store.get('paint', 0),
  owned: store.get('owned', [true,false,false,false]),
  bank: store.get('bank', 0),
  level: 1, combo: 0, comboT: 0, fareStreak: 0, fareT: 0,
  px: 0, pvx: 0,         // player lateral pos / vel
  shake: 0, shakeX: 0, shakeY: 0,
  traffic: [], coinsArr: [], pax: [],
  parts: [], rockets: [], confetti: [], popups: [],
  spawnT: 0, coinT: 2, paxT: 5,
  inv: 0,                // invincible timer (after revive)
  revived: false,
  cdT: 0, cdN: 3,
  overT: 0,
  honkCd: 0,
  scroll: 0,            // world scroll for parallax
  menuRickX: -0.4,      // rickshaw drive-in position (opening)
};

/* ---------- perspective ---------- */
function horizonY(){ return H * 0.30; }
function roadHalf(z){ return lerp(Math.min(W * 0.54, 400), Math.max(W * 0.06, 30), z); }
function curveOff(z){ return (G.curve || 0) * (1 - z) * roadHalf(z); } // S-curve shift, 0 at horizon
function laneX(lane, z){ return W / 2 + curveOff(z) + lane * roadHalf(z) * 0.80; }
function yAt(z){ z = clamp(z, 0, 1); return lerp(H * 0.97, horizonY(), Math.pow(z, 0.92)); }
function scaleAt(z){ z = clamp(z, 0, 1); return lerp(1, 0.10, Math.pow(z, 0.85)); }
function baseS(){ return clamp(W / 390, 0.72, 1.35); } // overall art scale

/* ---------- particles ---------- */
function puff(x, y, n, cols, spd, life, grav, size){
  for(let i = 0; i < n; i++){
    const a = rand(0, TAU), s = rand(spd * 0.3, spd);
    G.parts.push({x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - spd * 0.35,
      life: rand(life * 0.6, life), maxLife: life, col: pick(cols),
      size: rand(size * 0.6, size * 1.3), grav: grav || 0});
  }
}
function popup(x, y, text, col, size){
  G.popups.push({x, y, text, col: col || '#fff', life: 1.1, size: size || 20});
}
function firework(x, y){
  G.rockets.push({x, y: H + 10, tx: x, ty: y, vy: -rand(H * 0.9, H * 1.15), col: pick(['#ff5d5d','#ffd166','#6ee7ff','#c084fc','#7CFC98','#ff9f1c']), trail: []});
}
function confettiBurst(n, x, y){
  x = x == null ? W / 2 : x; y = y == null ? H * 0.25 : y;
  const cols = ['#ff5d5d','#ffd166','#6ee7ff','#c084fc','#7CFC98','#ff9f1c','#f472b6'];
  for(let i = 0; i < n; i++)
    G.confetti.push({x: x + rand(-40, 40), y, vx: rand(-160, 160), vy: rand(-320, -60),
      rot: rand(0, TAU), vr: rand(-8, 8), w: rand(5, 10), h: rand(7, 13),
      col: pick(cols), life: rand(2.2, 3.6)});
}
function updateParts(dt){
  const g = G;
  for(let i = g.parts.length - 1; i >= 0; i--){
    const p = g.parts[i];
    p.life -= dt; if(p.life <= 0){ g.parts.splice(i, 1); continue; }
    p.vy += (p.grav || 0) * dt; p.x += p.vx * dt; p.y += p.vy * dt;
  }
  for(let i = g.rockets.length - 1; i >= 0; i--){
    const r = g.rockets[i];
    r.trail.push({x: r.x, y: r.y, life: 0.4});
    r.y += r.vy * dt; r.vy += H * 0.55 * dt;
    for(const t of r.trail) t.life -= dt;
    if(r.vy > -40 || r.y <= r.ty){
      // explode
      for(let k = 0; k < 42; k++){
        const a = rand(0, TAU), s = rand(60, 320);
        g.parts.push({x: r.x, y: r.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
          life: rand(0.7, 1.5), maxLife: 1.5, col: Math.random() < 0.3 ? '#ffffff' : r.col,
          size: rand(2, 4.5), grav: 160, spark: true});
      }
      AudioSys.pop();
      g.rockets.splice(i, 1);
    }
  }
  for(let i = g.confetti.length - 1; i >= 0; i--){
    const c = g.confetti[i];
    c.life -= dt; if(c.life <= 0 || c.y > H + 30){ g.confetti.splice(i, 1); continue; }
    c.vy += 260 * dt; c.vy = Math.min(c.vy, 190);
    c.vx *= (1 - 0.6 * dt);
    c.x += c.vx * dt + Math.sin(g.time * 6 + c.rot) * 40 * dt;
    c.y += c.vy * dt; c.rot += c.vr * dt;
  }
  for(let i = g.popups.length - 1; i >= 0; i--){
    const p = g.popups[i];
    p.life -= dt; p.y -= 46 * dt;
    if(p.life <= 0) g.popups.splice(i, 1);
  }
}
function drawParts(){
  const g = G;
  for(const r of g.rockets){
    ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 2;
    ctx.beginPath();
    for(let i = 0; i < r.trail.length; i++){
      const t = r.trail[i];
      if(t.life > 0){ ctx.globalAlpha = t.life * 1.4; ctx.fillStyle = r.col; ctx.fillRect(t.x - 1, t.y - 6, 2, 8); }
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(r.x, r.y, 3, 0, TAU); ctx.fill();
  }
  for(const p of g.parts){
    const a = clamp(p.life / (p.maxLife || 1), 0, 1);
    ctx.globalAlpha = p.spark ? a : a * 0.85;
    ctx.fillStyle = p.col;
    if(p.spark){
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 6, p.size, p.size / 3);
      ctx.fillRect(p.x - p.size / 6, p.y - p.size / 2, p.size / 3, p.size);
    } else {
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + a * 0.5), 0, TAU); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  for(const c of g.confetti){
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot);
    ctx.globalAlpha = clamp(c.life, 0, 1);
    ctx.fillStyle = c.col; ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  for(const p of g.popups){
    ctx.globalAlpha = clamp(p.life, 0, 1);
    ctx.font = '800 ' + p.size + 'px -apple-system,Segoe UI,Roboto,sans-serif';
    ctx.textAlign = 'center';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.65)';
    ctx.strokeText(p.text, p.x, p.y);
    ctx.fillStyle = p.col; ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;
}

/* ---------- sky / background ---------- */
function skyColors(){
  // dayT: 0..1 ; keyframes
  const t = G.dayT;
  let top, bot, sun;
  if(t < 0.42){ const k = t / 0.42; top = [56,130,246]; bot = [186,230,253]; sun = 1; }        // day
  else if(t < 0.58){ const k = (t - 0.42) / 0.16; top = lerp3([56,130,246],[64,20,80],k); bot = lerp3([186,230,253],[255,140,80],k); sun = 1 - k * 0.4; } // sunset
  else if(t < 0.88){ const k = (t - 0.58) / 0.30; top = lerp3([64,20,80],[5,8,25],k); bot = lerp3([255,140,80],[20,16,50],k); sun = 0; } // night
  else { const k = (t - 0.88) / 0.12; top = lerp3([5,8,25],[56,130,246],k); bot = lerp3([20,16,50],[186,230,253],k); sun = k * 0.6; } // sunrise
  return {top, bot, sun};
}
function lerp3(a, b, k){ return [lerp(a[0],b[0],k)|0, lerp(a[1],b[1],k)|0, lerp(a[2],b[2],k)|0]; }
const rgb = c => 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';

const SHOP_SIGNS = ['CHAI ☕','HOTEL','MOBILE','SAREE','MITHAI','BARBER ✂','DABBA','CYBER','BAKERY','TAILOR'];
const SHOP_COLS = ['#ff5d5d','#ffd166','#6ee7ff','#c084fc','#7CFC98','#ff9f1c'];
const CAR_COLS = ['#e63946','#2a9d8f','#e9c46a','#4361ee','#f4f4f4','#7209b7'];
const LANES4 = [-0.78, -0.26, 0.26, 0.78];   // 4 lanes — room to breathe
const PAINTS = [
  {name:'Classic Yellow', body:['#ffe27a','#ffc93c','#e89b00'], cost:0},
  {name:'Emerald',        body:['#a7f3d0','#34d399','#059669'], cost:150},
  {name:'Crimson',        body:['#fca5a5','#ef4444','#b91c1c'], cost:300},
  {name:'Royal Purple',   body:['#c4b5fd','#8b5cf6','#6d28d9'], cost:600},
];
const LEVELS = ['Gali Cruiser','Sheher Rider','Highway Raja','Night Sultan','Toofan Express','Asli Legend'];

/* ---------- missions (persistent, cross-session goals) ---------- */
const MISSIONS = [
  {id:'score500', name:'Pehli Sawari',   desc:'Score 500 in one run',        target:500,  reward:50,  kind:'run',  key:'score'},
  {id:'dist3000', name:'Marathon',       desc:'Travel 3000m in one run',     target:3000, reward:100, kind:'run',  key:'dist'},
  {id:'lvl3',     name:'Sheher Ka Raja', desc:'Reach Level 3',               target:3,    reward:75,  kind:'run',  key:'level'},
  {id:'lvl6',     name:'Asli Legend',    desc:'Reach Level 6',               target:6,    reward:150, kind:'run',  key:'level'},
  {id:'coins100', name:'Coin Collector', desc:'Collect 100 coins (total)',   target:100,  reward:60,  kind:'life', key:'coins'},
  {id:'fares10',  name:'Fare Wala',      desc:'Pick up 10 fares (total)',    target:10,   reward:60,  kind:'life', key:'fares'},
  {id:'near25',   name:'Close Call King',desc:'25 near-misses (total)',      target:25,   reward:80,  kind:'life', key:'nears'},
  {id:'honk50',   name:'Horn Master',    desc:'Honk 50 vehicles aside (total)',target:50,  reward:70,  kind:'life', key:'honks'},
  {id:'trip1',    name:'First Sawari',   desc:'Complete 1 trip',               target:1,   reward:40,  kind:'life', key:'trips'},
  {id:'trip15',   name:'Trip Sultan',    desc:'Complete 15 trips (total)',     target:15,  reward:100, kind:'life', key:'trips'},
];
G.mstat = Object.assign({coins:0, fares:0, nears:0, honks:0, trips:0}, store.get('mstat', {}));
G.mprog = store.get('mprog', {});
G.garTab = 'paints';
G.mode = 'arcade';        // 'arcade' | 'trip'
G.menuView = 'modes';     // 'modes' | 'garage'
G.garageFrom = 'over';    // where the garage was opened from
G.trip = null;            // per-run trip state
function missionProg(m){
  if(m.kind === 'run'){
    if(m.key === 'score') return Math.floor(G.score);
    if(m.key === 'dist') return Math.floor(G.dist);
    if(m.key === 'level') return G.level;
  }
  return G.mstat[m.key] || 0;
}
function checkMissions(){
  let changed = false;
  for(const m of MISSIONS){
    const st = G.mprog[m.id] || (G.mprog[m.id] = {p:0, done:false});
    if(st.done) continue;
    const p = missionProg(m);
    if(p !== st.p){ st.p = p; changed = true; }
    if(p >= m.target){
      st.done = true; st.p = m.target; changed = true;
      G.bank = (G.bank || 0) + m.reward;
      popup(W / 2, H * 0.30, '🎯 MISSION COMPLETE!', '#ffd166', 30);
      popup(W / 2, H * 0.30 + 42, m.name + '  +' + m.reward + ' 🪙', '#7CFC98', 22);
      confettiBurst(40, W / 2, H * 0.3);
      AudioSys.fare();
      updateHUD();
    }
  }
  if(changed){ store.set('mprog', G.mprog); store.set('mstat', G.mstat); store.set('bank', G.bank); }
}
function drawSky(){
  const {top, bot, sun} = skyColors();
  const gr = ctx.createLinearGradient(0, 0, 0, horizonY() * 1.15);
  gr.addColorStop(0, rgb(top)); gr.addColorStop(1, rgb(bot));
  ctx.fillStyle = gr; ctx.fillRect(0, 0, W, horizonY() * 1.15 + 2);
  const night = 1 - sun;
  if(night > 0.25){
    ctx.fillStyle = '#fff';
    for(let i = 0; i < 70; i++){
      const sx = hash(i * 3.1) * W, sy = hash(i * 7.7) * horizonY() * 0.9;
      const tw = 0.5 + 0.5 * Math.sin(G.time * 3 + i);
      ctx.globalAlpha = ((night - 0.25) * 1.3) * tw;
      ctx.fillRect(sx, sy, 2, 2);
    }
    ctx.globalAlpha = 1;
  }
  // clouds
  for(let i = 0; i < 4; i++){
    const cw = 120 + hash(i * 9.1) * 130;
    let cx = (hash(i * 4.4) * (W + 500) - G.time * (9 + i * 4)) % (W + 500);
    if(cx < 0) cx += W + 500;
    cx -= 250;
    const cy = 26 + hash(i * 3.3) * horizonY() * 0.55;
    ctx.fillStyle = night > 0.5 ? 'rgba(40,46,80,.55)' : 'rgba(255,255,255,.88)';
    ctx.beginPath();
    ctx.ellipse(cx, cy, cw / 2, cw / 6, 0, 0, TAU);
    ctx.ellipse(cx - cw / 4, cy + 6, cw / 3.4, cw / 7, 0, 0, TAU);
    ctx.ellipse(cx + cw / 4, cy + 5, cw / 3, cw / 7.5, 0, 0, TAU);
    ctx.fill();
  }
  // birds (day)
  if(sun > 0.5){
    ctx.strokeStyle = 'rgba(30,30,40,.7)'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
    for(let i = 0; i < 5; i++){
      const bx = (hash(i * 8.8) * W + G.time * (26 + i * 5)) % (W + 60) - 30;
      const by = 40 + hash(i * 5.5) * horizonY() * 0.5 + Math.sin(G.time * 2 + i) * 8;
      const f = Math.sin(G.time * 9 + i * 2) * 3;
      ctx.beginPath();
      ctx.moveTo(bx - 9, by + f); ctx.quadraticCurveTo(bx - 3, by - 4, bx, by);
      ctx.quadraticCurveTo(bx + 3, by - 4, bx + 9, by + f);
      ctx.stroke();
    }
  }
  // sun / moon
  const ang = Math.PI * (0.08 + 0.84 * (G.dayT < 0.6 ? G.dayT / 0.6 : (G.dayT - 0.6) / 0.4));
  const sx = W * 0.5 - Math.cos(ang) * W * 0.42, sy = horizonY() - Math.sin(ang) * horizonY() * 0.72;
  if(sun > 0.05){
    const sg = ctx.createRadialGradient(sx, sy, 4, sx, sy, 70);
    sg.addColorStop(0, 'rgba(255,240,180,.95)'); sg.addColorStop(0.35, 'rgba(255,200,90,.5)'); sg.addColorStop(1, 'rgba(255,180,60,0)');
    ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(sx, sy, 70, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff3c4'; ctx.beginPath(); ctx.arc(sx, sy, 22, 0, TAU); ctx.fill();
  } else {
    const mg = ctx.createRadialGradient(sx, sy, 4, sx, sy, 44);
    mg.addColorStop(0, 'rgba(220,228,255,.5)'); mg.addColorStop(1, 'rgba(220,228,255,0)');
    ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(sx, sy, 44, 0, TAU); ctx.fill();
    ctx.fillStyle = '#e8ecff'; ctx.beginPath(); ctx.arc(sx, sy, 18, 0, TAU); ctx.fill();
    ctx.fillStyle = rgb(top); ctx.beginPath(); ctx.arc(sx - 7, sy - 4, 15, 0, TAU); ctx.fill();
  }
  // far skyline
  ctx.fillStyle = 'rgba(20,24,48,.55)';
  const base = horizonY();
  ctx.beginPath(); ctx.moveTo(0, base);
  for(let x = 0; x <= W; x += 14){
    const h = 14 + hash(Math.floor(x / 14) * 1.7) * 46;
    ctx.lineTo(x, base - h);
  }
  ctx.lineTo(W, base); ctx.closePath(); ctx.fill();
  // atmospheric haze at horizon
  const hz = ctx.createLinearGradient(0, base - 46, 0, base + 30);
  hz.addColorStop(0, 'rgba(210,225,250,0)');
  hz.addColorStop(1, 'rgba(210,225,250,' + (0.22 * sun + 0.06) + ')');
  ctx.fillStyle = hz; ctx.fillRect(0, base - 46, W, 76);
}

function drawBuildings(){
  const base = horizonY(), night = 1 - skyColors().sun, sun = skyColors().sun;
  // far skyline silhouette — slowest parallax
  {
    const sp = 190, off = (G.scroll * 0.08) % sp;
    ctx.fillStyle = night > 0.5 ? '#141a30' : 'rgba(90,110,150,.55)';
    for(let bx = -sp; bx < W + sp; bx += sp){
      const x = bx - off;
      const idx = Math.round((bx + G.scroll * 0.08) / sp);
      const bh = 60 + hash(idx * 5.77) * 130;
      ctx.fillRect(x, base - bh, sp * 0.72, bh);
      if(hash(idx * 9.2) > 0.6) ctx.fillRect(x + sp * 0.3, base - bh - 18, 6, 18); // antenna
    }
  }
  const layers = [
    {par: 0.22, minH: 46, maxH: 120, col: '#2c3352'},
    {par: 0.55, minH: 70, maxH: 165, col: '#20263e'},
  ];
  for(let L = 0; L < layers.length; L++){
    const ly = layers[L], sp = 150;
    const bcol = shade(ly.col, Math.round(sun * 46));
    const off = (G.scroll * ly.par) % sp;
    for(let bx = -sp; bx < W + sp; bx += sp){
      const x = bx - off;
      const idx = Math.round((bx + G.scroll * ly.par) / sp);
      const bh = ly.minH + hash(idx * 13.7 + L * 91) * (ly.maxH - ly.minH);
      const bw = sp * (0.62 + hash(idx * 7.3 + L) * 0.3);
      // body w/ vertical shade
      const bgd = ctx.createLinearGradient(x, 0, x + bw, 0);
      bgd.addColorStop(0, bcol); bgd.addColorStop(1, shade(bcol, -18));
      ctx.fillStyle = bgd;
      ctx.fillRect(x, base - bh, bw, bh);
      // cornice
      ctx.fillStyle = 'rgba(0,0,0,.3)';
      ctx.fillRect(x, base - bh, bw, 6);
      // roof props
      if(hash(idx * 3.3) > 0.55){
        ctx.fillStyle = shade(bcol, -25);
        ctx.fillRect(x + bw * 0.25, base - bh - 14, 16, 14);       // water tank
        ctx.fillRect(x + bw * 0.25 - 3, base - bh - 17, 22, 4);
      }
      if(hash(idx * 4.9) > 0.6){
        ctx.strokeStyle = shade(bcol, -30); ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(x + bw * 0.7, base - bh);
        ctx.lineTo(x + bw * 0.7 + 8, base - bh - 22); ctx.stroke(); // antenna
        ctx.fillStyle = '#c084fc';
        ctx.beginPath(); ctx.arc(x + bw * 0.55, base - bh - 12, 7, 0, TAU); ctx.fill(); // dish
      }
      // windows
      const cols = 4, rows = Math.floor(bh / 26);
      for(let cxi = 0; cxi < cols; cxi++) for(let ryi = 0; ryi < rows; ryi++){
        const lit = hash(idx * 31 + cxi * 7 + ryi * 13 + L) < (0.22 + night * 0.6);
        ctx.fillStyle = lit ? (night > 0.45 ? '#ffe08a' : '#8fa5c8') : 'rgba(0,0,0,.30)';
        ctx.fillRect(x + 8 + cxi * (bw - 16) / cols, base - bh + 12 + ryi * 26, (bw - 16) / cols * 0.55, 13);
      }
      // awning on near layer
      if(L === 1 && hash(idx * 6.1) > 0.5){
        const aw = bw * 0.7, ax = x + bw * 0.15, ay = base - 46;
        const acol = SHOP_COLS[Math.floor(hash(idx * 2.2) * SHOP_COLS.length)];
        ctx.fillStyle = acol; ctx.globalAlpha = 0.9;
        for(let sxi = 0; sxi < 6; sxi++){
          ctx.fillStyle = sxi % 2 ? acol : 'rgba(255,255,255,.85)';
          ctx.fillRect(ax + sxi * aw / 6, ay, aw / 6, 12);
        }
        ctx.globalAlpha = 1;
        ctx.fillStyle = 'rgba(0,0,0,.25)';
        ctx.beginPath(); ctx.moveTo(ax, ay + 12); ctx.lineTo(ax + aw, ay + 12);
        ctx.lineTo(ax + aw - 8, ay + 22); ctx.lineTo(ax + 8, ay + 22); ctx.closePath(); ctx.fill();
      }
    }
  }
  // glowing shop signboards
  const sp2 = 230, off2 = G.scroll % sp2;
  for(let bx = -sp2; bx < W + sp2; bx += sp2){
    const x = bx - off2;
    const idx = Math.round((bx + G.scroll) / sp2);
    if(hash(idx * 5.1) < 0.35) continue;
    const sw = 96, sh = 32, sy2 = base - 108 - hash(idx * 9.2) * 42;
    ctx.fillStyle = '#10131f';
    ctx.fillRect(x, sy2, sw, 58);
    const scol = SHOP_COLS[Math.floor(hash(idx * 3.9) * SHOP_COLS.length)];
    neonSign(x + 6, sy2 + 6, sw - 12, sh, scol, SHOP_SIGNS[Math.floor(hash(idx * 7.7) * SHOP_SIGNS.length)], night);
  }
  // festive string lights between rooftops (night)
  if(night > 0.4){
    const sp3 = 460, off3 = (G.scroll * 0.55) % sp3;
    for(let bx = -sp3; bx < W + sp3; bx += sp3){
      const x1 = bx - off3, x2 = x1 + sp3 * 0.55;
      const y1 = base - 130 - hash(bx) * 40, y2 = base - 120 - hash(bx * 1.3) * 40;
      ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x1, y1);
      ctx.quadraticCurveTo((x1 + x2) / 2, Math.max(y1, y2) + 34, x2, y2); ctx.stroke();
      for(let t = 0.08; t < 1; t += 0.09){
        const px = lerp(x1, x2, t);
        const py = (1 - t) * (1 - t) * y1 + 2 * (1 - t) * t * (Math.max(y1, y2) + 34) + t * t * y2;
        const bc = ['#ffd166','#ff9f1c','#ff5d5d','#7CFC98'][(t * 40 | 0) % 4];
        const gg = ctx.createRadialGradient(px, py + 4, 1, px, py + 4, 9);
        gg.addColorStop(0, bc); gg.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(px, py + 4, 9, 0, TAU); ctx.fill();
        ctx.fillStyle = '#fff8e0'; ctx.beginPath(); ctx.arc(px, py + 4, 2.4, 0, TAU); ctx.fill();
      }
    }
  }
}

function drawStreetlights(){
  const base = horizonY(), night = 1 - skyColors().sun;
  const sp = 300, off = G.scroll % sp;
  for(let bx = -sp; bx < W + sp * 2; bx += sp){
    const x = bx - off;
    for(const side of [-1, 1]){
      const px = W / 2 + curveOff(0) + side * (roadHalf(0) + 34);
      const top = base + 40;
      ctx.strokeStyle = '#2b3048'; ctx.lineWidth = 6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(px, H * 0.99); ctx.lineTo(px, top); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(px, top); ctx.lineTo(px - side * 30, top + 8); ctx.stroke();
      // lamp head
      ctx.fillStyle = '#3a4158';
      rr(px - side * 30 - 10, top + 2, 20, 9, 4); ctx.fill();
      if(night > 0.35){
        const lx = px - side * 30, ly2 = top + 14;
        ctx.fillStyle = '#ffe9b0';
        rr(lx - 6, ly2 - 4, 12, 7, 3); ctx.fill();
        const gg = ctx.createRadialGradient(lx, ly2, 2, lx, ly2, 52);
        gg.addColorStop(0, 'rgba(255,220,140,.85)'); gg.addColorStop(1, 'rgba(255,200,100,0)');
        ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(lx, ly2, 52, 0, TAU); ctx.fill();
        ctx.fillStyle = 'rgba(255,210,120,' + (0.12 * night) + ')';
        ctx.beginPath(); ctx.ellipse(lx, H * 0.99, 64, 17, 0, 0, TAU); ctx.fill();
      }
    }
  }
}

/* ---------- road ---------- */
function drawRoad(){
  const hy = horizonY();
  const night = 1 - skyColors().sun;
  // ground
  const gg = ctx.createLinearGradient(0, hy, 0, H);
  gg.addColorStop(0, night > 0.5 ? '#1a2033' : '#79a85e');
  gg.addColorStop(1, night > 0.5 ? '#0d1120' : '#557f45');
  ctx.fillStyle = gg; ctx.fillRect(0, hy, W, H - hy);
  // road body
  const rb = roadHalf(0), rt = roadHalf(1);
  const cc0 = W / 2 + curveOff(0); // road center at the bottom of the screen
  const rg = ctx.createLinearGradient(0, hy, 0, H);
  rg.addColorStop(0, night > 0.5 ? '#20263a' : '#3a3a4a');
  rg.addColorStop(1, night > 0.5 ? '#2c3247' : '#484858');
  ctx.fillStyle = rg;
  ctx.beginPath();
  ctx.moveTo(W / 2 - rt, hy); ctx.lineTo(W / 2 + rt, hy);
  ctx.lineTo(cc0 + rb, H); ctx.lineTo(cc0 - rb, H);
  ctx.closePath(); ctx.fill();
  // asphalt speckle + oil stains (scrolling)
  for(let i = 0; i < 42; i++){
    const wz = (hash(i * 1.31) * 1600 - G.scroll * 1.6) % 1600;
    const z = 1 - wz / 1600;
    if(z < 0 || z > 1) continue;
    const yy = yAt(z);
    const xx = W / 2 + curveOff(z) + (hash(i * 2.17) * 2 - 1) * roadHalf(z) * 0.9;
    ctx.fillStyle = 'rgba(0,0,0,.16)';
    ctx.beginPath(); ctx.ellipse(xx, yy, lerp(9, 1.5, z), lerp(5, 1, z), 0, 0, TAU); ctx.fill();
  }
  for(let i = 0; i < 5; i++){
    const wz = (hash(i * 7.7) * 1600 - G.scroll * 1.6) % 1600;
    const z = 1 - wz / 1600;
    if(z < 0.05 || z > 1) continue;
    const yy = yAt(z);
    const xx = W / 2 + curveOff(z) + (hash(i * 3.9) * 2 - 1) * roadHalf(z) * 0.5;
    ctx.fillStyle = 'rgba(10,10,14,.28)';
    ctx.beginPath(); ctx.ellipse(xx, yy, lerp(26, 4, z), lerp(14, 2.5, z), 0.4, 0, TAU); ctx.fill();
  }
  // edge lines (glow at night)
  if(night > 0.4){
    ctx.save(); ctx.globalAlpha = 0.5 * night;
    ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 7;
    for(const s of [-1, 1]){
      ctx.beginPath();
      ctx.moveTo(W / 2 + s * rt * 0.92, hy + 4);
      ctx.lineTo(cc0 + s * rb * 0.97, H);
      ctx.stroke();
    }
    ctx.restore();
  }
  ctx.strokeStyle = night > 0.5 ? 'rgba(255,220,120,.9)' : 'rgba(255,255,255,.9)';
  ctx.lineWidth = 4;
  for(const s of [-1, 1]){
    ctx.beginPath();
    ctx.moveTo(W / 2 + s * rt * 0.92, hy + 4);
    ctx.lineTo(cc0 + s * rb * 0.97, H);
    ctx.stroke();
  }
  // lane dashes
  const dashLen = 46, gapLen = 40, period = dashLen + gapLen;
  const off = (G.scroll * 1.6) % period;
  for(const l of [-0.33, 0.33]){
    for(let y = H + period; y > hy; y -= period){
      const yy = y - off;
      if(yy < hy || yy > H) continue;
      const z = clamp(1 - (yy - hy) / (H * 0.97 - hy), 0, 1);
      const w = lerp(7, 1.5, z);
      const x = W / 2 + curveOff(z) + l * lerp(rb, rt, z) * 2 * 0.66;
      ctx.fillStyle = night > 0.5 ? 'rgba(255,240,180,.9)' : 'rgba(255,255,255,.78)';
      ctx.fillRect(x - w / 2, yy - dashLen * (1 - z * 0.7), w, dashLen * (1 - z * 0.7));
    }
  }
  // sidewalks
  ctx.fillStyle = night > 0.5 ? '#1c2233' : '#9aa0b0';
  const swB = 46, swT = 8;
  for(const s of [-1, 1]){
    ctx.beginPath();
    ctx.moveTo(W / 2 + s * rt, hy); ctx.lineTo(W / 2 + s * (rt + swT), hy);
    ctx.lineTo(cc0 + s * (rb + swB), H); ctx.lineTo(cc0 + s * rb, H);
    ctx.closePath(); ctx.fill();
    // curb highlight
    ctx.strokeStyle = night > 0.5 ? 'rgba(255,220,120,.35)' : 'rgba(255,255,255,.5)';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(W / 2 + s * rt * 1.0, hy + 2);
    ctx.lineTo(cc0 + s * rb * 1.0, H);
    ctx.stroke();
  }
  // trees receding on both sides
  for(let k = 0; k < 5; k++){
    let z = (k * 0.24 + (G.scroll * 0.00045)) % 1.25;
    if(z > 1) continue;
    for(const side of [-1, 1]){
      if(hash(k * 3.7 + (side > 0 ? 9 : 1)) < 0.25) continue;
      const tx = W / 2 + curveOff(z) + side * (roadHalf(z) + 44 * scaleAt(z) + 26);
      drawTree(tx, yAt(z) + 4, baseS() * scaleAt(z) * 1.15, k * 7 + side);
    }
  }
  // festive pennant banners across the road
  for(const bz of [0.32, 0.62, 0.94]){
    const z = (bz + (G.scroll * 0.00012)) % 1.05;
    if(z > 1 || z < 0.08) continue;
    const y = yAt(z) - 120 * scaleAt(z);
    if(y < hy + 8) continue;
    const hw = roadHalf(z);
    const sag = 30 * scaleAt(z);
    ctx.strokeStyle = 'rgba(20,20,30,.6)'; ctx.lineWidth = Math.max(1.5, 3 * scaleAt(z));
    const bcx = W / 2 + curveOff(z);
    ctx.beginPath(); ctx.moveTo(bcx - hw, y);
    ctx.quadraticCurveTo(bcx, y + sag, bcx + hw, y); ctx.stroke();
    const n = Math.floor(hw / (16 * scaleAt(z) + 6));
    const fcols = ['#ff5d5d','#ffd166','#6ee7ff','#7CFC98','#c084fc'];
    for(let i = 1; i < n; i++){
      const t = i / n;
      const fx = lerp(bcx - hw, bcx + hw, t);
      const fy = (1 - t) * (1 - t) * y + 2 * (1 - t) * t * (y + sag) + t * t * y;
      const fs = 11 * scaleAt(z);
      const flut = Math.sin(G.time * 6 + i * 1.7 + bz * 9) * 2 * scaleAt(z);
      ctx.fillStyle = fcols[i % fcols.length];
      ctx.beginPath();
      ctx.moveTo(fx - fs / 2, fy); ctx.lineTo(fx + fs / 2, fy);
      ctx.lineTo(fx + flut, fy + fs * 1.15); ctx.closePath(); ctx.fill();
    }
  }
}
function wheel(x, y, r, spin){
  // detailed wheel w/ rotating spokes — call inside an already-scaled transform
  ctx.fillStyle = '#0e0f12';
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  ctx.fillStyle = '#23262c';
  ctx.beginPath(); ctx.arc(x, y, r * 0.78, 0, TAU); ctx.fill();
  // tread ticks
  ctx.strokeStyle = '#0e0f12'; ctx.lineWidth = r * 0.16;
  for(let k = 0; k < 12; k++){
    const a = k * TAU / 12;
    ctx.beginPath();
    ctx.moveTo(x + Math.cos(a) * r * 0.86, y + Math.sin(a) * r * 0.86);
    ctx.lineTo(x + Math.cos(a) * r * 0.70, y + Math.sin(a) * r * 0.70);
    ctx.stroke();
  }
  ctx.save(); ctx.translate(x, y); ctx.rotate(spin);
  ctx.fillStyle = '#9aa1ad';
  ctx.beginPath(); ctx.arc(0, 0, r * 0.52, 0, TAU); ctx.fill();
  ctx.fillStyle = '#5d636e';
  for(let k = 0; k < 5; k++){
    ctx.save(); ctx.rotate(k * TAU / 5);
    rr(-r * 0.09, -r * 0.5, r * 0.18, r * 1.0, r * 0.08); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
  ctx.fillStyle = '#d4d9e2';
  ctx.beginPath(); ctx.arc(x, y, r * 0.14, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.5)';
  ctx.beginPath(); ctx.arc(x - r * 0.05, y - r * 0.05, r * 0.05, 0, TAU); ctx.fill();
}
function tailLamp(x, y, w, h, night){
  if(night > 0.35){
    const tg = ctx.createRadialGradient(x, y, 2, x, y, w * 2.2);
    tg.addColorStop(0, 'rgba(255,70,70,.85)'); tg.addColorStop(1, 'rgba(255,60,60,0)');
    ctx.fillStyle = tg; ctx.beginPath(); ctx.arc(x, y, w * 2.2, 0, TAU); ctx.fill();
  }
  const lg = ctx.createLinearGradient(x - w / 2, 0, x + w / 2, 0);
  lg.addColorStop(0, '#7f1d1d'); lg.addColorStop(0.5, '#ef4444'); lg.addColorStop(1, '#7f1d1d');
  ctx.fillStyle = lg;
  rr(x - w / 2, y - h / 2, w, h, h * 0.3); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.35)';
  rr(x - w / 2 + 2, y - h / 2 + 2, w - 4, h * 0.28, h * 0.15); ctx.fill();
}
function plate(x, y, w, text){
  ctx.fillStyle = '#f8fafc';
  rr(x - w / 2, y - 7, w, 14, 3); ctx.fill();
  ctx.strokeStyle = '#334155'; ctx.lineWidth = 1.5;
  rr(x - w / 2, y - 7, w, 14, 3); ctx.stroke();
  ctx.fillStyle = '#1d4ed8';
  ctx.fillRect(x - w / 2, y - 7, 10, 14);
  ctx.fillStyle = '#fff'; ctx.font = '800 7px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('IND', x - w / 2 + 5, y + 2.5);
  ctx.fillStyle = '#111'; ctx.font = '800 8.5px -apple-system,Segoe UI,Roboto,sans-serif';
  ctx.fillText(text, x + 5, y + 3.5);
}
function neonSign(x, y, w, h, color, text, night){
  // occasional flicker — alive at night
  const flick = night > 0.4 && hash(Math.floor(G.time * 9) + x * 0.37 + y) > 0.93 ? 0.25 : 1;
  if(night > 0.35){
    ctx.fillStyle = color; ctx.globalAlpha = 0.28 * night * flick;
    ctx.fillRect(x - 7, y - 5, w + 14, h + 10);
    ctx.globalAlpha = 1;
  }
  ctx.globalAlpha = flick;
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w, h);
  ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(0,0,0,.75)';
  ctx.font = '800 12px -apple-system,Segoe UI,Roboto,sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(text, x + w / 2, y + h / 2 + 4.5);
}
function drawTree(x, y, s, seed){
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  const sway = Math.sin(G.time * 1.6 + seed) * 2.5;
  ctx.fillStyle = 'rgba(0,0,0,.3)';
  ctx.beginPath(); ctx.ellipse(0, 2, 22, 6, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#5b3a22';
  ctx.fillRect(-4, -34, 8, 36);
  ctx.fillStyle = '#3f6b34';
  ctx.beginPath(); ctx.arc(sway - 8, -46, 20, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(sway + 10, -40, 16, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(sway + 1, -58, 14, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.10)';
  ctx.beginPath(); ctx.arc(sway - 12, -52, 9, 0, TAU); ctx.fill();
  ctx.restore();
}
/* ---------- vehicle art ---------- */
function rr(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function shadow(x, y, w, s){
  ctx.fillStyle = 'rgba(0,0,0,.35)';

/* The star of the show: auto rickshaw, rear 3/4 view */
function drawRickshaw(x, y, s, opt){
  opt = opt || {};
  const tilt = opt.tilt || 0, spin = opt.spin || 0;
  const night = 1 - skyColors().sun;
  const bob = Math.sin(G.time * 7) * 1.6;
  ctx.save();
  ctx.translate(x, y); ctx.rotate(tilt); ctx.scale(s, s);
  // ground shadow
  ctx.fillStyle = 'rgba(0,0,0,.40)';
  ctx.beginPath(); ctx.ellipse(0, 6, 70, 14, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.22)';
  ctx.beginPath(); ctx.ellipse(0, 3, 52, 9, 0, 0, TAU); ctx.fill();

  ctx.translate(0, bob * 0.4);
  // wheels
  for(const wx of [-46, 46]){
    wheel(wx, -20, 20, spin);
    // yellow mudguard w/ black lip
    ctx.fillStyle = '#f7b500';
    ctx.beginPath(); ctx.arc(wx, -20, 25, Math.PI * 1.03, TAU * 0.99); ctx.fill();
    ctx.lineWidth = 3.5; ctx.strokeStyle = '#191919';
    ctx.beginPath(); ctx.arc(wx, -20, 25, Math.PI * 1.03, TAU * 0.99); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.28)';
    ctx.beginPath(); ctx.arc(wx, -20, 25, Math.PI * 1.25, Math.PI * 1.6); ctx.stroke();
  }

  // ---- main body (garage paint) ----
  const bw = 124;
  const PC = PAINTS[(opt.paint !== undefined ? opt.paint : G.paint) % PAINTS.length].body;
  const bodyG = ctx.createLinearGradient(0, -118, 0, -24);
  bodyG.addColorStop(0, PC[0]); bodyG.addColorStop(0.45, PC[1]); bodyG.addColorStop(1, PC[2]);
  ctx.fillStyle = bodyG;
  rr(-bw / 2, -116, bw, 92, 16); ctx.fill();
  // 3/4 curvature: darker right edge, highlight left edge
  const edgeG = ctx.createLinearGradient(-bw / 2, 0, bw / 2, 0);
  edgeG.addColorStop(0, 'rgba(255,255,255,.30)'); edgeG.addColorStop(0.18, 'rgba(255,255,255,0)');
  edgeG.addColorStop(0.82, 'rgba(0,0,0,0)'); edgeG.addColorStop(1, 'rgba(120,50,0,.38)');
  ctx.fillStyle = edgeG;
  rr(-bw / 2, -116, bw, 92, 16); ctx.fill();
  // chrome waist strip
  const chrome = ctx.createLinearGradient(0, -66, 0, -58);
  chrome.addColorStop(0, '#e8ecf2'); chrome.addColorStop(0.5, '#9aa1ad'); chrome.addColorStop(1, '#dfe3ea');
  ctx.fillStyle = chrome;
  rr(-bw / 2 + 4, -66, bw - 8, 8, 4); ctx.fill();
  // lower black panel
  const lowG = ctx.createLinearGradient(0, -58, 0, -24);
  lowG.addColorStop(0, '#2b2b30'); lowG.addColorStop(1, '#101014');
  ctx.fillStyle = lowG;
  rr(-bw / 2 + 6, -58, bw - 12, 34, 10); ctx.fill();

  // ---- canopy ----
  const canG = ctx.createLinearGradient(0, -168, 0, -110);
  canG.addColorStop(0, '#4a4a52'); canG.addColorStop(0.6, '#232328'); canG.addColorStop(1, '#101013');
  ctx.fillStyle = canG;
  rr(-66, -166, 132, 56, 20); ctx.fill();
  // fabric folds
  ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = 3;
  for(const fx of [-38, 0, 38]){
    ctx.beginPath(); ctx.moveTo(fx, -162); ctx.quadraticCurveTo(fx + 5, -138, fx, -114); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(255,255,255,.10)'; ctx.lineWidth = 2;
  for(const fx of [-30, 8, 46]){
    ctx.beginPath(); ctx.moveTo(fx, -162); ctx.quadraticCurveTo(fx + 5, -138, fx, -114); ctx.stroke();
  }
  // rear window (open) with driver silhouette inside
  ctx.fillStyle = '#0b0d12';
  rr(-44, -158, 88, 40, 12); ctx.fill();
  const dbob = Math.sin(G.time * 2.3) * 2;
  // driver shoulders + back of head
  ctx.fillStyle = '#3f2d1e';
  rr(-26, -146 + dbob, 52, 26, 10); ctx.fill();       // shoulders
  ctx.fillStyle = '#241a10';
  ctx.beginPath(); ctx.arc(0, -148 + dbob, 15, 0, TAU); ctx.fill();  // hair
  ctx.fillStyle = 'rgba(255,255,255,.08)';
  ctx.beginPath(); ctx.arc(-4, -152 + dbob, 6, 0, TAU); ctx.fill();
  // window frame + glass glint
  ctx.strokeStyle = '#3c3c44'; ctx.lineWidth = 4;
  rr(-44, -158, 88, 40, 12); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-36, -124); ctx.lineTo(-8, -156); ctx.stroke();

  // ---- marigold garland (sways with the ride) ----
  const sway = Math.sin(G.time * 6) * 2.2;
  for(let gx = -56; gx <= 56; gx += 10){
    const gy = -112 + Math.sin(gx * 0.7 + G.time * 6) * 1.8 + sway * (gx / 56);
    ctx.fillStyle = '#2f7a3d';
    ctx.beginPath(); ctx.ellipse(gx + 5, gy + 2, 4, 2.4, 0.5, 0, TAU); ctx.fill();
    ctx.fillStyle = (gx / 10) % 2 ? '#ff9f1c' : '#ffd166';
    ctx.beginPath(); ctx.arc(gx, gy, 4.6, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.beginPath(); ctx.arc(gx - 1.2, gy - 1.5, 1.4, 0, TAU); ctx.fill();
  }

  // ---- back panel art ----
  ctx.fillStyle = '#0f7a3d'; ctx.fillRect(-bw / 2 + 6, -106, bw - 12, 7);
  ctx.fillStyle = '#d43d2a'; ctx.fillRect(-bw / 2 + 6, -99, bw - 12, 4);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#141414';
  ctx.font = '900 16px -apple-system,Segoe UI,Roboto,sans-serif';
  ctx.fillText('HORN OK PLEASE', 0, -80);
  ctx.font = '700 8.5px -apple-system,Segoe UI,Roboto,sans-serif';
  ctx.fillStyle = '#4a3200';
  ctx.fillText('USE DIPPER AT NIGHT', 0, -68);
  // reflective chevrons
  for(let cx = -52; cx <= 52; cx += 16){
    ctx.fillStyle = (cx / 16) % 2 ? '#d43d2a' : '#f8fafc';
    ctx.save(); ctx.translate(cx, -36); ctx.rotate(0.5);
    ctx.fillRect(-5, -3, 10, 6); ctx.restore();
  }
  // tail lamps
  tailLamp(-54, -82, 13, 30, night);
  tailLamp(54, -82, 13, 30, night);
  // chrome bumper
  const bmp = ctx.createLinearGradient(0, -30, 0, -18);
  bmp.addColorStop(0, '#f1f4f8'); bmp.addColorStop(0.5, '#8f96a3'); bmp.addColorStop(1, '#c9cfd9');
  ctx.fillStyle = bmp;
  rr(-64, -30, 128, 12, 6); ctx.fill();
  ctx.fillStyle = '#4b5058';
  for(const bx of [-52, 52]){ ctx.beginPath(); ctx.arc(bx, -24, 2.4, 0, TAU); ctx.fill(); }
  plate(0, -46, 62, 'MH 12 TU 143');
  // exhaust tip
  const exg = ctx.createLinearGradient(0, -26, 0, -18);
  exg.addColorStop(0, '#e5e9ef'); exg.addColorStop(1, '#6b7280');
  ctx.fillStyle = exg;
  rr(30, -27, 18, 9, 3); ctx.fill();
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.ellipse(47, -22.5, 3, 4.5, 0, 0, TAU); ctx.fill();
  // mirrors
  for(const ms of [-1, 1]){
    ctx.strokeStyle = '#1c1c20'; ctx.lineWidth = 4.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(ms * 62, -128); ctx.lineTo(ms * 76, -142); ctx.stroke();
    ctx.fillStyle = '#1c1c20';
    ctx.beginPath(); ctx.ellipse(ms * 78, -144, 7, 9, ms * 0.3, 0, TAU); ctx.fill();
    ctx.fillStyle = '#9fb6cc';
    ctx.beginPath(); ctx.ellipse(ms * 78, -144, 4, 6, ms * 0.3, 0, TAU); ctx.fill();
  }
  // night aura
  if(night > 0.45){
    const ag = ctx.createRadialGradient(0, -70, 20, 0, -70, 150);
    ag.addColorStop(0, 'rgba(255,190,120,' + (0.10 * night) + ')');
    ag.addColorStop(1, 'rgba(255,190,120,0)');
    ctx.fillStyle = ag;
    ctx.beginPath(); ctx.arc(0, -70, 150, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

function drawCar(x, y, s, col, seed){
  const night = 1 - skyColors().sun;
  const spin = (G.wheelAng || 0) * (0.7 + hash(seed) * 0.6);
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = 'rgba(0,0,0,.38)';
  ctx.beginPath(); ctx.ellipse(0, 5, 58, 12, 0, 0, TAU); ctx.fill();
  const taxi = hash(seed * 3.3) > 0.72;
  for(const wx of [-38, 38]){
    wheel(wx, -16, 15, spin);
    // wheel arch shadow
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.beginPath(); ctx.arc(wx, -16, 18, Math.PI, TAU); ctx.fill();

  const bg = ctx.createLinearGradient(0, -96, 0, -20);
  bg.addColorStop(0, shade(col, 26)); bg.addColorStop(0.55, col); bg.addColorStop(1, shade(col, -42));
  ctx.fillStyle = bg;
  rr(-52, -92, 104, 72, 14); ctx.fill();
  // side shading
  const sg = ctx.createLinearGradient(-52, 0, 52, 0);
  sg.addColorStop(0, 'rgba(255,255,255,.22)'); sg.addColorStop(0.25, 'rgba(255,255,255,0)');
  sg.addColorStop(0.8, 'rgba(0,0,0,0)'); sg.addColorStop(1, 'rgba(0,0,0,.30)');
  ctx.fillStyle = sg; rr(-52, -92, 104, 72, 14); ctx.fill();
  // cabin
  ctx.fillStyle = night > 0.5 ? '#202f49' : '#37485f';
  rr(-40, -124, 80, 42, 12); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.20)';
  rr(-40, -124, 80, 12, 10); ctx.fill();
  // roof highlight + pillars
  ctx.fillStyle = shade(col, 20);
  rr(-44, -100, 88, 12, 6); ctx.fill();
  // wiper hint
  ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-14, -88); ctx.lineTo(6, -108); ctx.stroke();
  if(taxi){
    // roof taxi sign
    ctx.fillStyle = '#111'; rr(-20, -140, 40, 14, 4); ctx.fill();

    // antenna
    ctx.strokeStyle = '#222'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(34, -122); ctx.lineTo(40, -146); ctx.stroke();
  }
  // chrome strip + lamps + plate + bumper
  ctx.fillStyle = 'rgba(230,235,242,.85)';
  ctx.fillRect(-52, -52, 104, 5);
  tailLamp(-42, -40, 15, 13, night);
  tailLamp(42, -40, 15, 13, night);
  ctx.fillStyle = 'rgba(0,0,0,.25)';
  rr(-52, -28, 104, 10, 5); ctx.fill();
  plate(0, -40, 54, 'MH 02 ' + (1000 + Math.floor(hash(seed * 12.9) * 9000)));
  // mirrors
  ctx.fillStyle = shade(col, -30);
  ctx.beginPath(); ctx.arc(-56, -96, 6, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(56, -96, 6, 0, TAU); ctx.fill();
  ctx.restore();
}
function shade(hex, amt){
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) + amt, g = ((n >> 8) & 255) + amt, b = (n & 255) + amt;
  r = clamp(r, 0, 255); g = clamp(g, 0, 255); b = clamp(b, 0, 255);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

function drawCoin(x, y, s){
  const sq = Math.abs(Math.cos(G.time * 5 + x * 0.05));
  const night = 1 - skyColors().sun;
  if(night > 0.4){
    const cg = ctx.createRadialGradient(x, y, 2, x, y, 26 * s);
    cg.addColorStop(0, 'rgba(255,210,90,.5)'); cg.addColorStop(1, 'rgba(255,210,90,0)');
    ctx.fillStyle = cg; ctx.beginPath(); ctx.arc(x, y, 26 * s, 0, TAU); ctx.fill();
  }
  ctx.save(); ctx.translate(x, y); ctx.scale(s * (0.35 + 0.65 * sq), s);
  const g = ctx.createRadialGradient(-4, -6, 2, 0, 0, 18);
  g.addColorStop(0, '#fff6c0'); g.addColorStop(0.55, '#ffd23e'); g.addColorStop(1, '#b97a00');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, 16, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#9a6200'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(0, 0, 11.5, 0, TAU); ctx.stroke();
  ctx.fillStyle = '#9a6200'; ctx.font = '900 15px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('₹', 0, 5.5);
  ctx.restore();
  ctx.fillStyle = 'rgba(255,255,255,' + (0.35 + 0.35 * Math.sin(G.time * 6 + y)) + ')';
  ctx.beginPath(); ctx.arc(x - 8 * s, y - 10 * s, 2.5 * s, 0, TAU); ctx.fill();
}

  ctx.fillStyle = skin;
  ctx.beginPath(); ctx.arc(0, -64, 11.5, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.18)';
  ctx.beginPath(); ctx.arc(0, -64, 11.5, 0.4, Math.PI - 0.4); ctx.fill();  // hair
  ctx.fillStyle = skin;
  ctx.beginPath(); ctx.arc(-4, -62, 2, 0, TAU); ctx.arc(4, -62, 2, 0, TAU); ctx.fill(); // eyes
  ctx.strokeStyle = '#5b3a1e'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(0, -58, 4, 0.3, Math.PI - 0.3); ctx.stroke();   // smile
  // waving arm
  const wa = wave ? Math.sin(G.time * 9) * 0.45 : 0;
  ctx.strokeStyle = skin; ctx.lineWidth = 7.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(11, -46);
  ctx.quadraticCurveTo(20, -56, 23 + wa * 9, -68 - Math.abs(wa) * 7); ctx.stroke();
  // other arm
  ctx.beginPath(); ctx.moveTo(-11, -46); ctx.lineTo(-16, -30); ctx.stroke();
  ctx.restore();
}
/* ---------- entities & gameplay ---------- */
function resetRun(){
  G.traffic = []; G.coinsArr = []; G.pax = [];
  G.parts = []; G.popups = [];
  G.speedT = 0; G.dist = 0; G.score = 0; G.coins = 0; G.fares = 0;
  G.px = 0; G.pvx = 0; G.inv = 0; G.revived = false;
  G.hearts = 3; G.invulnT = 0; G.slowT = 0; G.curve = 0;
  G.spawnT = 1.7; G.coinT = 2.5; G.paxT = 6; G.honkCd = 0;
  G.drag = false; G.dragX = 0;
  G.tapZones = [];
  G.level = 1; G.combo = 0; G.comboT = 0; G.fareStreak = 0; G.fareT = 0;
  G.trip = {phase:'wait', pax:null, dropDist:0, dropLane:0, waitT:1.5, aboardT:0, trips:0, earned:0};
}
function playerSpeed(){ return lerp(1.5, 3.4, G.speedT); }

function spawnTraffic(){
  const lanes = LANES4;
  // keep at least one lane breathable near spawn
  const busy = lanes.filter(l => G.traffic.some(v => Math.abs(v.lane - l) < 0.3 && v.z > 0.6));
  const free = lanes.filter(l => !busy.includes(l));
  if(free.length < 2) return;   // 4 lanes: always leave room to move
  const lane = pick(free);
  const r = Math.random();
  const type = r < 0.48 ? 'car' : r < 0.68 ? 'bike' : r < 0.84 ? 'bus' : 'truck';
  G.traffic.push({
    type, lane, dodgeLane: lane, z: 1.06,
    spd: type === 'bike' ? rand(0.42, 0.6) : rand(0.30, 0.52),
    col: type === 'car' ? pick(CAR_COLS) : type === 'bus' ? pick(['#e63946','#f59e0b','#2a9d8f']) : pick(CAR_COLS),
    seed: Math.random() * 1000, counted: false, wob: rand(0, TAU), brake: 0,
  });
}
function spawnCoinLine(){
  const lane = pick(LANES4);
  for(let i = 0; i < 5; i++) G.coinsArr.push({lane, z: 1.0 + i * 0.085});
}
function spawnPax(){
  const side = Math.random() < 0.5 ? -1 : 1;
  G.pax.push({side, z: 1.0,
    skin: pick(['#8d5a2b','#a06a35','#7a4a22']),
    shirt: pick(['#e63946','#4361ee','#2a9d8f','#7209b7','#f59e0b'])});
}
function spawnTripPax(){
  const side = Math.random() < 0.5 ? -1 : 1;
  G.trip.pax = {side, z: 1.0,
    skin: pick(['#8d5a2b','#a06a35','#7a4a22']),
    shirt: pick(['#e63946','#4361ee','#2a9d8f','#7209b7','#f59e0b'])};
}
function tripBail(msg){
  const t = G.trip;
  if(!t || t.phase !== 'aboard') return;
  t.phase = 'wait'; t.waitT = 3; t.pax = null;
  popup(W / 2, H * 0.42, msg || '🧍 Passenger bailed!', '#ff9f1c', 24);
}

function doHonk(){
  if(G.state !== ST.PLAY || G.honkCd > 0) return;
  G.honkCd = 0.5;
  AudioSys.honk();
  const px = laneX(G.px, 0), py = yAt(0) - 150 * baseS();
  popup(px, py, '📯 HONK!', '#ffd166', 22);
  // shoo the nearest vehicle ahead
  let bestV = null, bestZ = 99;
  for(const v of G.traffic){
    if(v.z > 0.04 && v.z < 0.65 && Math.abs(v.lane - G.px) < 0.62 && v.z < bestZ){ bestV = v; bestZ = v.z; }
  }
  if(bestV){
    const dir = bestV.lane >= G.px ? 1 : -1;
    let nl = bestV.lane + dir * 0.7;
    nl = clamp(nl, -0.78, 0.78);
    // don't shove into another vehicle
    const blocked = G.traffic.some(o => o !== bestV && Math.abs(o.lane - nl) < 0.35 && Math.abs(o.z - bestV.z) < 0.2);
    if(!blocked){ bestV.dodgeLane = nl; bestV.brake = 1; G.mstat.honks++; }
  }
  puff(px, py + 40, 6, ['#ffd166','#fff'], 90, 0.5, 0, 5);
}

function crash(){
  if(G.inv > 0 || G.invulnT > 0 || G.state !== ST.PLAY) return;
  tripBail(); // trip-mode passenger jumps out on any crash
  const px = laneX(G.px, 0), py = yAt(0) - 60 * baseS();
  if(G.hearts > 1){
    // lose a heart but keep driving — runs last much longer
    G.hearts--;
    G.invulnT = 1.8; G.slowT = 0.8;
    G.shake = Math.max(G.shake, 0.9);
    G.speedT *= 0.55;
    AudioSys.crash();
    let nearV = null, nz = 99;
    for(const v of G.traffic){ const az = Math.abs(v.z); if(az < 0.18 && az < nz){ nz = az; nearV = v; } }
    if(nearV) G.px = clamp(G.px + (G.px >= nearV.lane ? 0.38 : -0.38), -1.12, 1.12);
    G.traffic = G.traffic.filter(v => v.z > 0.45 || Math.abs(v.lane - G.px) > 0.55);
    puff(px, py, 22, ['#ff5d5d','#f59e0b','#fff'], 250, 1.0, 300, 7);
    popup(px, py - 120 * baseS(), '💔', '#ff5d5d', 46);
    popup(px, py - 58 * baseS(), G.hearts + (G.hearts === 1 ? ' HEART LEFT!' : ' HEARTS LEFT'), '#ffd166', 22);
    updateHUD();
    return;
  }
  G.state = ST.OVER; G.overT = 0;
  G.shake = 1;
  AudioSys.crash(); AudioSys.setEngine(false, 0);
  puff(px, py, 26, ['#ff5d5d','#f59e0b','#333','#fff'], 260, 1.1, 300, 7);
  if(G.score > G.best){ G.best = G.score; store.set('best', G.best); G.newBest = true; }
  else G.newBest = false;
  // bank lifetime coins for the garage
  G.bank = (G.bank || 0) + G.coins; store.set('bank', G.bank);
  document.getElementById('honkBtn').classList.add('hidden');
  document.getElementById('steerHint').classList.add('hidden');
}

function revive(){
  const grant = () => {
    G.revived = true;
    G.hearts = 3; // fresh hearts with the second chance
    G.traffic = G.traffic.filter(v => v.z > 0.55);
    G.inv = 3;
    G.state = ST.PLAY;
    document.getElementById('honkBtn').classList.remove('hidden');
    popup(W / 2, H * 0.4, '📺 REVIVED!', '#7CFC98', 30);
    updateHUD();
  };
  try{
    if(window.RR_ADS && window.RR_ADS.showRewarded) window.RR_ADS.showRewarded(ok => { if(ok) grant(); });
    else grant();
  }catch(e){ grant(); }
}

function updatePlay(dt){
  const g = G;
  g.speedT = Math.min(1, g.speedT + dt * 0.020);
  const ps = playerSpeed();
  g.scroll += lerp(140, 430, g.speedT) * dt;
  g.dist += lerp(9, 30, g.speedT) * dt;
  g.dayT = (g.dayT + dt / 160) % 1;
  if(g.inv > 0) g.inv -= dt;
  if(g.invulnT > 0) g.invulnT -= dt;
  if(g.honkCd > 0) g.honkCd -= dt;
  g.curve = Math.sin(g.dist * 0.011) * 0.42; // gentle S-curves keep the road alive
  if(g.comboT > 0){ g.comboT -= dt; if(g.comboT <= 0) g.combo = 0; }
  if(g.fareT > 0){ g.fareT -= dt; if(g.fareT <= 0) g.fareStreak = 0; }

  // levels — every 450m a new title, denser traffic
  const lv = Math.min(LEVELS.length, 1 + Math.floor(g.dist / 450));
  if(lv > g.level){
    g.level = lv;
    popup(W / 2, H * 0.30, 'LEVEL ' + lv + ' — ' + LEVELS[lv - 1], '#ffd166', 30);
    confettiBurst(50, W / 2, H * 0.3);
    AudioSys.fare();
  }

  // missions — check twice a second
  g.misT = (g.misT || 0) - dt;
  if(g.misT <= 0){ g.misT = 0.5; checkMissions(); }

  // steering
  const kL = keys.left, kR = keys.right;
  if(kL || kR) g.drag = false;
  if(g.drag){
    const target = clamp((g.dragX - (W / 2 + curveOff(0))) / (roadHalf(0) * 0.80), -1.12, 1.12);
    g.px += (target - g.px) * Math.min(1, 14 * dt);
    g.pvx = (target - g.px) * 6;
  } else {
    const ax = (kR ? 1 : 0) - (kL ? 1 : 0);
    g.pvx += ax * 11.5 * dt;
    g.pvx *= Math.max(0, 1 - 5.5 * dt);
    g.px += g.pvx * dt;
  }
  if(g.px > 1.12){ g.px = 1.12; g.pvx = Math.min(0, g.pvx); }
  if(g.px < -1.12){ g.px = -1.12; g.pvx = Math.max(0, g.pvx); }

  // exhaust + dust
  g.exT = (g.exT || 0) - dt;
  if(g.exT <= 0){
    g.exT = 0.09;
    const ex = laneX(g.px, 0) + 40 * baseS(), ey = yAt(0) - 22 * baseS();
    g.parts.push({x: ex + rand(-3, 3), y: ey, vx: rand(-20, 20), vy: rand(-70, -40),
      life: rand(0.4, 0.8), maxLife: 0.8, col: 'rgba(120,120,130,.5)', size: rand(4, 8), grav: -30});
  }
  if(Math.abs(g.pvx) > 2.2 && Math.random() < 0.5){
    const dx = laneX(g.px, 0), dy = yAt(0) - 8;
    g.parts.push({x: dx + rand(-30, 30), y: dy, vx: rand(-60, 60), vy: rand(-40, 0),
      life: 0.5, maxLife: 0.5, col: 'rgba(200,180,150,.45)', size: rand(5, 9), grav: 0});
  }

  // spawns
  g.spawnT -= dt;
  if(g.spawnT <= 0){ g.spawnT = lerp(1.15, 0.5, g.speedT) * Math.max(0.58, 1 - (g.level - 1) * 0.08) * (g.dist < 220 ? 1.35 : 1) * rand(0.8, 1.25); spawnTraffic(); }
  g.coinT -= dt;
  if(g.coinT <= 0){ g.coinT = rand(4, 8); spawnCoinLine(); }
  g.paxT -= dt;
  if(g.paxT <= 0){ g.paxT = rand(6, 11); if(G.mode === 'arcade') spawnPax(); }

  // traffic
  const rel = ps * 0.24;
  for(let i = g.traffic.length - 1; i >= 0; i--){
    const v = g.traffic[i];
    v.z -= (1 - v.spd) * rel * dt;
    v.lane += (v.dodgeLane - v.lane) * Math.min(1, 2.2 * dt);
    if(v.brake > 0) v.brake -= dt * 1.6;
    if(v.z < -0.12){ g.traffic.splice(i, 1); continue; }
    // near miss — chains into a combo
    if(!v.counted && v.z < 0.02 && v.z > -0.1){
      v.counted = true;
      const dl = Math.abs(v.lane - g.px);
      if(dl < 0.55 && dl >= 0.27){
        g.combo = (g.comboT > 0 ? g.combo : 0) + 1; g.comboT = 3;
        g.mstat.nears++;
        const pts = 15 * g.combo;
        g.score += pts;
        popup(laneX(g.px, 0), yAt(0) - 190 * baseS(),
          (g.combo > 1 ? 'CLOSE x' + g.combo + ' +' : 'CLOSE! +') + pts, '#6ee7ff', 20 + Math.min(10, g.combo * 2));
        for(let s = 0; s < 6; s++) g.parts.push({x: laneX(g.px, 0) + rand(-40, 40), y: yAt(0) - rand(60, 200),
          vx: 0, vy: rand(300, 520), life: 0.35, maxLife: 0.35, col: 'rgba(110,231,255,.7)', size: 3, grav: 0});
      }
    }
    // crash
    if(g.invulnT <= 0 && Math.abs(v.z) < 0.06 && Math.abs(v.lane - g.px) < 0.27){ crash(); return; }
  }
  // coins
  for(let i = g.coinsArr.length - 1; i >= 0; i--){
    const c = g.coinsArr[i];
    c.z -= rel * dt;
    if(c.z < -0.1){ g.coinsArr.splice(i, 1); continue; }
    if(Math.abs(c.z) < 0.075 && Math.abs(c.lane - g.px) < 0.26){
      g.coinsArr.splice(i, 1);
      g.coins++; g.mstat.coins++; g.score += 10;
      AudioSys.coin();
      puff(laneX(c.lane, 0), yAt(c.z), 8, ['#ffd23e','#fff3b0'], 120, 0.5, 0, 4);
    }
  }
  // passengers (arcade quick fares)
  if(G.mode === 'arcade'){
  for(let i = g.pax.length - 1; i >= 0; i--){
    const p = g.pax[i];
    p.z -= rel * dt;
    if(p.z < -0.15){ g.pax.splice(i, 1); continue; }
    if(p.z < 0.14 && p.z > -0.08 && Math.sign(g.px) === p.side && Math.abs(g.px) > 0.52){
      g.pax.splice(i, 1);
      g.fares++; g.mstat.fares++;
      g.fareStreak = (g.fareT > 0 ? g.fareStreak : 0) + 1; g.fareT = 8;
      const fare = (20 + Math.floor(g.speedT * 30)) * g.fareStreak;
      g.score += fare;
      AudioSys.fare();
      popup(W / 2 + p.side * W * 0.28, H * 0.55,
        '+₹' + fare + ' FARE' + (g.fareStreak > 1 ? ' x' + g.fareStreak : '') + ' 🙏', '#7CFC98', 24);
      puff(W / 2 + p.side * W * 0.28, H * 0.55, 10, ['#7CFC98','#fff'], 130, 0.6, 0, 4);
    }
  }
  }
  // ---- TRIP MODE: pick up, drive to the flag, drop off ----
  if(G.mode === 'trip'){
    const t = G.trip;
    if(t.phase === 'wait'){
      t.waitT -= dt;
      if(!t.pax && t.waitT <= 0) spawnTripPax();
      if(t.pax){
        const p = t.pax;
        p.z -= rel * dt;
        if(p.z < -0.15){ t.pax = null; t.waitT = 2; }
        else if(p.z < 0.14 && p.z > -0.08 && Math.sign(g.px) === p.side && Math.abs(g.px) > 0.52){
          // passenger hops in — destination appears ahead
          t.phase = 'aboard'; t.aboardT = 0; t.pax = null;
          t.dropDist = g.dist + rand(350, 500);
          t.dropLane = pick(LANES4);
          popup(W / 2, H * 0.38, '🧍 PASSENGER ABOARD!', '#7CFC98', 26);
          popup(W / 2, H * 0.38 + 38, 'Drive to the 🚩 flag!', '#ffd166', 20);
          AudioSys.fare();
        }
      }
    } else { // aboard — head for the flag
      t.aboardT += dt;
      const rem = t.dropDist - g.dist;
      if(rem <= 10 && Math.abs(g.px - t.dropLane) < 0.42){
        const tip = Math.max(0, Math.round(40 - t.aboardT * 0.6));
        const fare = 60 + (g.level - 1) * 12 + tip;
        t.trips++; t.earned += fare;
        g.mstat.trips++;
        g.score += fare;
        popup(W / 2, H * 0.38, '+₹' + fare + ' FARE 🙏', '#7CFC98', 30);
        if(tip > 0) popup(W / 2, H * 0.38 + 42, 'incl. ₹' + tip + ' speed tip ⚡', '#ffd166', 20);
        confettiBurst(30, W / 2, H * 0.38);
        AudioSys.fare();
        puff(W / 2, H * 0.5, 14, ['#7CFC98','#ffd166','#fff'], 160, 0.7, 0, 5);
        t.phase = 'wait'; t.waitT = 2.5;
        updateHUD();
      }
    }
  }
  g.score = Math.max(g.score, Math.floor(g.dist)); // distance floor + kept bonuses
  g.wheelAng = (g.wheelAng || 0) + dt * (5 + g.speedT * 11);
  AudioSys.setEngine(true, g.speedT);
  updateHUD();
}

/* ---------- input ---------- */
const keys = {left: false, right: false};
window.addEventListener('keydown', e => {
  if(e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
  if(e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
  if(e.key === ' ' || e.key === 'Enter'){ handleTap(W / 2, H / 2); e.preventDefault(); }
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
});
window.addEventListener('keyup', e => {
  if(e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
  if(e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
});
cv.addEventListener('contextmenu', e => e.preventDefault());
let pDown = null;
cv.addEventListener('pointerdown', e => {
  AudioSys.init();
  if(AudioSys.ctx && AudioSys.ctx.state === 'suspended') AudioSys.ctx.resume();
  pDown = {x: e.clientX, y: e.clientY, t: performance.now()};
  if(G.state === ST.PLAY){ G.drag = true; G.dragX = e.clientX; }
});
window.addEventListener('pointermove', e => {
  if(G.state === ST.PLAY && G.drag) G.dragX = e.clientX;
});
window.addEventListener('pointerup', e => {
  const wasDrag = G.drag;
  G.drag = false;
  if(!pDown) return;
  const dx = e.clientX - pDown.x, dy = e.clientY - pDown.y;
  const dtap = performance.now() - pDown.t;
  pDown = null;
  if(Math.hypot(dx, dy) < 14 && dtap < 400 && !wasDrag) handleTap(e.clientX, e.clientY);
});
document.getElementById('muteBtn').addEventListener('click', e => { e.stopPropagation(); AudioSys.init(); AudioSys.toggleMute(); });
document.getElementById('pauseBtn').addEventListener('click', e => {
  e.stopPropagation();
  if(G.state === ST.PLAY){ G.paused = !G.paused; document.getElementById('pauseBtn').textContent = G.paused ? '▶' : '⏸'; AudioSys.setEngine(!G.paused, G.speedT); }
});
document.getElementById('honkBtn').addEventListener('pointerdown', e => { e.stopPropagation(); AudioSys.init(); doHonk(); });

function handleTap(x, y){
  AudioSys.init();
  if(G.state === ST.OPENING){
    if(G.ot > 2.6){ G.state = ST.MENU; G.menuView = 'modes'; }
    return;
  }
  if(G.state === ST.OVER && G.overT > 0.9){
    for(const z of G.tapZones){
      if(x >= z.x && x <= z.x + z.w && y >= z.y && y <= z.y + z.h){ z.fn(); return; }
    }
  }
  if(G.state === ST.MENU){
    for(const z of G.tapZones){
      if(x >= z.x && x <= z.x + z.w && y >= z.y && y <= z.y + z.h){ z.fn(); return; }
    }
  }
}

function startCountdown(){
  if(G.state !== ST.OPENING && G.state !== ST.OVER && G.state !== ST.MENU) return;
  resetRun();
  G.state = ST.COUNTDOWN; G.cdT = 0; G.cdN = 3; G.cdLast = 4;
  confettiBurst(60);
  document.getElementById('hudCoins').classList.remove('hidden');
  document.getElementById('pauseBtn').classList.remove('hidden');
  document.getElementById('honkBtn').classList.remove('hidden');
  const sh = document.getElementById('steerHint');
  sh.classList.remove('hidden'); sh.style.opacity = 1;
  setTimeout(() => { sh.style.opacity = 0; }, 4500);
}

function updateHUD(){
  document.getElementById('scoreVal').textContent = G.score;
  document.getElementById('coinVal').textContent = G.coins;
  document.getElementById('fareVal').textContent = (G.mode === 'trip' && G.trip) ? G.trip.trips : G.fares;
  document.getElementById('heartVal').textContent = '♥'.repeat(Math.max(0, G.hearts || 0)) || '—';
  const tv = document.getElementById('tripVal');
  if(tv){
    if(G.mode === 'trip' && G.trip){
      const t = G.trip;
      tv.textContent = t.phase === 'aboard'
        ? ' · 🚩 ' + Math.max(0, Math.round(t.dropDist - G.dist)) + 'm'
        : ' · 🧍 waiting…';
    } else tv.textContent = '';
  }
  document.getElementById('hudLevel').textContent = 'LV ' + G.level;
  const hb = document.getElementById('honkBtn');
  if(hb) hb.style.opacity = G.honkCd > 0 ? 0.45 : 1;
}

/* ---------- grand opening sequence ---------- */
function updateOpening(dt){
  const g = G;
  g.ot += dt;
  g.dayT = 0.72; // night for fireworks
  if(Math.random() < dt * 1.4) firework(rand(W * 0.1, W * 0.9), rand(H * 0.08, H * 0.35));
  if(Math.random() < dt * 6 && g.ot < 4) confettiBurst(2);
  // rickshaw drive-in dust
  if(g.ot > 1.6 && g.ot < 3.1 && Math.random() < 0.6){
    const rx = W / 2 + easeOut(clamp((g.ot - 1.6) / 1.4, 0, 1)) * (W / 2 + 220) - 220;
    puff(rx - 60, H * 0.72, 2, ['rgba(200,180,150,.5)'], 60, 0.7, 0, 7);
  }
  if(g.ot > 2.6 && !g.openReady){
    g.openReady = true;
  }
}
function easeOut(t){ return 1 - Math.pow(1 - t, 3); }
function easeBack(t){ const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }

function drawOpening(){
  const g = G;
  // night city backdrop
  drawSky(); drawBuildings(); drawRoad();
  // sweeping searchlights
  for(const sd of [-1, 1]){
    const sa = Math.sin(g.time * 0.7 + (sd > 0 ? 2.2 : 0)) * 0.5;
    ctx.save(); ctx.globalAlpha = 0.15;
    ctx.translate(W / 2 + sd * W * 0.42, H); ctx.rotate(sa * 0.6 - sd * 0.22);
    const beamG = ctx.createLinearGradient(0, 0, 0, -H * 0.8);
    beamG.addColorStop(0, 'rgba(255,250,220,.9)'); beamG.addColorStop(1, 'rgba(255,250,220,0)');
    ctx.fillStyle = beamG;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-48, -H * 0.8); ctx.lineTo(48, -H * 0.8); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  // banner
  if(g.ot > 0.4){
    const bt = clamp((g.ot - 0.4) / 0.5, 0, 1);
    const bw = Math.min(W * 0.86, 380), bh = 64;
    const bx = W / 2 - bw / 2, by = H * 0.13;
    ctx.save();
    ctx.translate(W / 2, by + bh / 2); ctx.scale(easeBack(bt), easeBack(bt)); ctx.translate(-W / 2, -(by + bh / 2));
    const bgd = ctx.createLinearGradient(0, by, 0, by + bh);
    bgd.addColorStop(0, '#e63946'); bgd.addColorStop(1, '#a41623');
    ctx.fillStyle = bgd;
    rr(bx, by, bw, bh, 16); ctx.fill();
    ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 3;
    rr(bx, by, bw, bh, 16); ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = '800 26px -apple-system,Segoe UI,Roboto,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('🎉 GRAND OPENING 🎉', W / 2, by + 41);
    ctx.restore();
  }
  // title
  if(g.ot > 1.0){
    const tt = clamp((g.ot - 1.0) / 0.8, 0, 1);
    ctx.save();
    ctx.globalAlpha = tt;
    ctx.textAlign = 'center';
    const ty = H * 0.30;
    ctx.font = '900 ' + Math.min(W * 0.13, 64) + 'px -apple-system,Segoe UI,Roboto,sans-serif';
    ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(0,0,0,.55)';
    const title = 'RICKSHAW RUSH';
    // staggered letters
    let lx = W / 2;
    ctx.save();
    const fs = Math.min(W * 0.115, 58);
    ctx.font = '900 ' + fs + 'px -apple-system,Segoe UI,Roboto,sans-serif';
    const widths = [...title].map(ch => ctx.measureText(ch).width);
    const total = widths.reduce((a, b) => a + b, 0);
    lx = W / 2 - total / 2;
    [...title].forEach((ch, i) => {
      const lt = clamp((g.ot - 1.0 - i * 0.045) / 0.35, 0, 1);
      const yy = ty - (1 - easeOut(lt)) * 60;
      ctx.globalAlpha = lt;
      ctx.lineWidth = 7; ctx.strokeStyle = 'rgba(0,0,0,.6)';
      ctx.strokeText(ch, lx + widths[i] / 2, yy);
      const grd = ctx.createLinearGradient(0, yy - fs, 0, yy);
      grd.addColorStop(0, '#ffe66d'); grd.addColorStop(1, '#f59e0b');
      ctx.fillStyle = ch === ' ' ? 'transparent' : grd;
      ctx.fillText(ch, lx + widths[i] / 2, yy);
      lx += widths[i];
    });
    ctx.restore();
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.font = '600 15px -apple-system,Segoe UI,Roboto,sans-serif';
    ctx.fillText('Dodge traffic · Grab fares · Honk loud!', W / 2, ty + 44);
    ctx.restore();
  }
  // rickshaw drives in
  if(g.ot > 1.6){
    const rt = easeOut(clamp((g.ot - 1.6) / 1.4, 0, 1));
    const rx = lerp(-220, W / 2, rt);
    const bounce = rt >= 1 ? Math.abs(Math.sin(g.time * 5)) * 6 : 0;
    drawRickshaw(rx, H * 0.72 - bounce, baseS() * 1.15, {beam: true, tilt: (1 - rt) * 0.06, spin: g.ot * 9});
  }
  // tap to start
  if(g.ot > 3.1){
    ctx.textAlign = 'center';
    ctx.globalAlpha = 0.65 + 0.35 * Math.sin(g.time * 5);
    ctx.fillStyle = '#fff';
    ctx.font = '800 24px -apple-system,Segoe UI,Roboto,sans-serif';
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,.6)';
    const msg = '👆 TAP TO START';
    ctx.strokeText(msg, W / 2, H * 0.88);
    ctx.fillText(msg, W / 2, H * 0.88);
    ctx.globalAlpha = 1;
  }
  drawParts();
  // vignette
  vignette();
}

function drawCountdown(){
  drawSky(); drawBuildings(); drawStreetlights(); drawRoad();
  drawRickshaw(laneX(0, 0), yAt(0), baseS() * 1.12, {beam: true});
  const n = Math.ceil(3 - G.cdT);
  ctx.textAlign = 'center';
  const label = n > 0 ? String(n) : 'GO!';
  const frac = G.cdT % 1;
  const sc = 1 + (1 - frac) * 0.6;
  ctx.save();
  ctx.translate(W / 2, H * 0.42); ctx.scale(sc, sc);
  ctx.font = '900 110px -apple-system,Segoe UI,Roboto,sans-serif';
  ctx.lineWidth = 10; ctx.strokeStyle = 'rgba(0,0,0,.6)';
  ctx.strokeText(label, 0, 0);
  ctx.fillStyle = n > 0 ? '#ffd166' : '#7CFC98';
  ctx.fillText(label, 0, 0);
  ctx.restore();
  // mode label
  ctx.textAlign = 'center';
  ctx.font = '800 20px -apple-system,Segoe UI,Roboto,sans-serif';
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,.6)';
  const modeMsg = G.mode === 'trip' ? '🧍 TRIP MODE' : '🛺 ARCADE';
  ctx.strokeText(modeMsg, W / 2, H * 0.42 + 90);
  ctx.fillStyle = G.mode === 'trip' ? '#7CFC98' : '#ffd166';
  ctx.fillText(modeMsg, W / 2, H * 0.42 + 90);
  drawParts();
  vignette();
}

function drawPlay(){
  drawSky(); drawBuildings(); drawStreetlights(); drawRoad();
  // passengers on sidewalks
  for(const p of G.pax){
    const z = clamp(p.z, 0, 1);
    const side = p.side;
    const x = W / 2 + curveOff(z) + side * (roadHalf(z) + 30 * scaleAt(z) + 14);
    drawPassenger(x, yAt(z), baseS() * scaleAt(z) * 0.9, true, p.skin, p.shirt);
  }
  // trip mode: waiting passenger waves + destination flag
  if(G.mode === 'trip' && G.trip){
    const t = G.trip;
    if(t.phase === 'wait' && t.pax){
      const p = t.pax, z = clamp(p.z, 0, 1);
      const x = W / 2 + curveOff(z) + p.side * (roadHalf(z) + 30 * scaleAt(z) + 14);
      const y = yAt(z), s = baseS() * scaleAt(z);
      drawPassenger(x, y, s * 0.95, true, p.skin, p.shirt);
      // waving "TAXI!" bubble
      const bob = Math.sin(G.time * 6) * 4 * s;
      ctx.textAlign = 'center';
      ctx.font = '800 ' + Math.max(11, 17 * s + 8) + 'px sans-serif';
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.6)';
      const bx = x, byy = y - 64 * s + bob;
      ctx.strokeText('👋 TAXI!', bx, byy);
      ctx.fillStyle = '#ffd166';
      ctx.fillText('👋 TAXI!', bx, byy);
    }
    if(t.phase === 'aboard'){
      const rem = t.dropDist - G.dist;
      if(rem < 650){
        const z = clamp(rem / 650, 0, 1);
        const fx = laneX(t.dropLane, z), fy = yAt(z), s = baseS() * scaleAt(z);
        // glowing guide strip on the target lane
        ctx.fillStyle = 'rgba(124,252,152,.16)';
        const steps = 8;
        for(let i = 0; i < steps; i++){
          const zz = (z * i) / steps;
          const zx = laneX(t.dropLane, zz), zy = yAt(zz);
          const zw = roadHalf(zz) * 0.30 * (1 - zz * 0.5);
          ctx.fillRect(zx - zw / 2, zy - 6 * (1 - zz) - 4, zw, 12 * (1 - zz) + 8);
        }
        // checkered flag pole
        const ph2 = 130 * s;
        ctx.strokeStyle = '#e8e8e8'; ctx.lineWidth = Math.max(2, 5 * s); ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(fx, fy - ph2); ctx.stroke();
        const fw = 46 * s, fh = 30 * s, fx0 = fx, fy0 = fy - ph2;
        const wave = Math.sin(G.time * 8) * 4 * s;
        for(let r2 = 0; r2 < 3; r2++) for(let c2 = 0; c2 < 4; c2++){
          ctx.fillStyle = (r2 + c2) % 2 ? '#111' : '#fff';
          ctx.fillRect(fx0 + c2 * fw / 4, fy0 + r2 * fh / 3 + Math.sin(G.time * 8 + c2) * 2 * s, fw / 4 + 1, fh / 3 + 1);
        }
        // distance label
        ctx.textAlign = 'center';
        ctx.font = '800 ' + Math.max(12, 20 * s + 8) + 'px sans-serif';
        ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,.65)';
        const lbl = '🚩 ' + Math.max(0, Math.round(rem)) + 'm';
        ctx.strokeText(lbl, fx, fy0 - 14 * s);
        ctx.fillStyle = '#7CFC98';
        ctx.fillText(lbl, fx, fy0 - 14 * s);
      }
    }
  }
  // coins
  for(const c of G.coinsArr){
    if(c.z < -0.05 || c.z > 1.05) continue;
    drawCoin(laneX(c.lane, c.z), yAt(c.z) - 10, baseS() * scaleAt(c.z) * 0.95);
  }
  // traffic, far first
  const sorted = [...G.traffic].sort((a, b) => b.z - a.z);
  for(const v of sorted){
    if(v.z < -0.08 || v.z > 1.1) continue;
    const x = laneX(v.lane, v.z), y = yAt(v.z), s = baseS() * scaleAt(v.z);
    if(v.type === 'car') drawCar(x, y, s, v.col, v.seed);
    else if(v.type === 'bus') drawBus(x, y, s, v.col);
    else if(v.type === 'truck') drawTruck(x, y, s);
    else drawBike(x, y, s, v.col);
    // brake-light flare when honked aside
    if(v.brake > 0){
      ctx.fillStyle = 'rgba(255,45,45,' + (0.55 * v.brake) + ')';
      ctx.beginPath(); ctx.ellipse(x, y - 34 * s, 46 * s, 13 * s, 0, 0, TAU); ctx.fill();
    }
  }
  // warm light pools under vehicles at night
  const nightP = 1 - skyColors().sun;
  if(nightP > 0.4){
    for(const v of sorted){
      if(v.z < -0.05 || v.z > 1) continue;
      const s2 = baseS() * scaleAt(v.z);
      ctx.fillStyle = 'rgba(255,190,120,' + (0.10 * nightP) + ')';
      ctx.beginPath(); ctx.ellipse(laneX(v.lane, v.z), yAt(v.z) + 4, 62 * s2, 10 * s2, 0, 0, TAU); ctx.fill();
    }
  }
  // player
  const px = laneX(G.px, 0), py = yAt(0);
  const pBlink = (G.inv > 0 || G.invulnT > 0) && Math.floor(G.time * 10) % 2 === 0;
  if(!pBlink){
    drawRickshaw(px, py, baseS() * 1.12, {tilt: clamp(G.pvx * 0.045, -0.14, 0.14), beam: true, spin: G.wheelAng || 0});
  }
  // speed lines
  if(G.speedT > 0.55){
    ctx.strokeStyle = 'rgba(255,255,255,' + ((G.speedT - 0.55) * 0.5) + ')';
    ctx.lineWidth = 3;
    for(let i = 0; i < 8; i++){
      const sx = hash(i * 7.7) * W, sy = hash(i * 3.1 + Math.floor(G.time * 8)) * H;
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx, sy + 40 + G.speedT * 60); ctx.stroke();
    }
  }
  drawParts();
  if(G.paused){
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff'; ctx.font = '900 44px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('⏸ PAUSED', W / 2, H / 2);
  }
  vignette();
}

function drawGameOver(){
  drawPlay();
  if(G.overT < 0.9) return;
  ctx.fillStyle = 'rgba(0,0,0,.62)'; ctx.fillRect(0, 0, W, H);
  const pw = Math.min(W * 0.86, 360), ph = G.revived ? 364 : 420;
  const px = W / 2 - pw / 2, py = H / 2 - ph / 2;
  ctx.fillStyle = '#141a2e';
  rr(px, py, pw, ph, 22); ctx.fill();
  ctx.strokeStyle = 'rgba(255,209,102,.5)'; ctx.lineWidth = 2;
  rr(px, py, pw, ph, 22); ctx.stroke();
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.font = '900 34px -apple-system,Segoe UI,Roboto,sans-serif';
  ctx.fillText('💥 CRASHED!', W / 2, py + 58);
  ctx.font = '600 17px -apple-system,Segoe UI,Roboto,sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,.75)';
  ctx.fillText('SCORE  ' + G.score, W / 2, py + 100);
  ctx.fillText('BEST  ' + G.best, W / 2, py + 126);
  ctx.fillText(G.mode === 'trip' && G.trip
    ? '🪙 ' + G.coins + ' coins   🧍 ' + G.trip.trips + ' trips   ₹' + G.trip.earned
    : '🪙 ' + G.coins + ' coins   🧍 ' + G.fares + ' fares', W / 2, py + 152);
  if(G.newBest){
    ctx.fillStyle = '#7CFC98'; ctx.font = '800 18px sans-serif';
    ctx.fillText('★ NEW BEST! ★', W / 2, py + 180);
  }
  G.tapZones = [];
  let by = py + (G.newBest ? 200 : 182);
  const bw = pw - 48, bx = W / 2 - bw / 2, bh = 52;
  if(!G.revived){
    ctx.fillStyle = '#7a2fd0';
    rr(bx, by, bw, bh, 14); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '800 18px sans-serif';
    ctx.fillText('📺 REVIVE & KEEP GOING', W / 2, by + 33);
    G.tapZones.push({x: bx, y: by, w: bw, h: bh, fn: revive});
    by += 64;
  }
  ctx.fillStyle = '#0ea5e9';
  rr(bx, by, bw, bh, 14); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = '800 18px sans-serif';
  ctx.fillText('🎨 GARAGE', W / 2, by + 33);
  G.tapZones.push({x: bx, y: by, w: bw, h: bh, fn: () => openGarage('over')});
  by += 64;
  ctx.fillStyle = '#f59e0b';
  rr(bx, by, bw, bh, 14); ctx.fill();
  ctx.fillStyle = '#3a2200'; ctx.font = '800 18px sans-serif';
  ctx.fillText('↺ DRIVE AGAIN', W / 2, by + 33);
  G.tapZones.push({x: bx, y: by, w: bw, h: bh, fn: startCountdown});
}

/* ---------- garage: spend coins on rickshaw paints ---------- */
function openGarage(from){
  if(!Array.isArray(G.owned) || G.owned.length !== PAINTS.length){
    const old = Array.isArray(G.owned) ? G.owned : [];
    G.owned = PAINTS.map((_, i) => i === 0 || !!old[i]);
  }
  G.garageMsgT = 0;
  G.menuView = 'garage';
  G.garageFrom = from || 'over';
  G.state = ST.MENU;
}
function garageTap(i){
  if(G.owned[i]){ G.paint = i; store.set('paint', i); AudioSys.coin(); }
  else if(G.bank >= PAINTS[i].cost){
    G.bank -= PAINTS[i].cost; store.set('bank', G.bank);
    G.owned[i] = true; store.set('owned', G.owned);
    G.paint = i; store.set('paint', i);
    AudioSys.fare();
    confettiBurst(40, W / 2, H * 0.4);
  } else {
    G.garageMsg = 'Need 🪙' + (PAINTS[i].cost - G.bank) + ' more — keep driving!';
    G.garageMsgT = 1.8;
  }
}
/* ---------- mode select: arcade vs trip ---------- */

    rr(px, cy, pw, ch, 18); ctx.stroke();
    ctx.textAlign = 'left';
    ctx.fillStyle = '#fff'; ctx.font = '900 22px -apple-system,Segoe UI,Roboto,sans-serif';
    ctx.fillText(c.icon + '  ' + c.title, px + 22, cy + 44);
    ctx.fillStyle = 'rgba(255,255,255,.65)'; ctx.font = '600 13.5px sans-serif';

    G.tapZones.push({x: px, y: cy, w: pw, h: ch, fn: ((m) => () => { G.mode = m; startCountdown(); })(c.mode)});

  // garage shortcut
